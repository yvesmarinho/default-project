---
# Comprehensive System Health Check
#
# This playbook performs a full system health check including:
# - Disk usage monitoring
# - Memory usage monitoring
# - CPU load monitoring
# - Service status verification
# - Docker health checks
# - Network connectivity tests
#
# Usage:
#   ansible-playbook health-check-system.yml
#
# Optional Variables:
#   - disk_warning: Disk usage warning threshold % (default: 80)
#   - disk_critical: Disk usage critical threshold % (default: 90)
#   - memory_warning: Memory usage warning threshold % (default: 80)
#   - fail_on_critical: Fail playbook on critical thresholds (default: true)

- name: System Health Check
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Threshold configuration
    disk_warning_threshold: "{{ disk_warning | default(80) }}"
    disk_critical_threshold: "{{ disk_critical | default(90) }}"
    memory_warning_threshold: "{{ memory_warning | default(80) }}"
    cpu_warning_threshold: "{{ cpu_warning | default(70) }}"

    # Fail on critical thresholds
    fail_on_critical: true

    # Services to check
    required_services:
      - docker
      - nginx

    # Network endpoints to test
    network_test_urls:
      - https://google.com
      - https://github.com

  tasks:
    - name: System resource checks
      block:
        - name: Check disk usage
          ansible.builtin.shell: df -h / | awk 'NR==2 {print $5}' | sed 's/%//'
          register: disk_usage
          changed_when: false

        - name: Check memory usage percentage
          ansible.builtin.shell: free | awk '/Mem:/ {printf "%.0f", $3/$2 * 100}'
          register: memory_usage
          changed_when: false

        - name: Check swap usage percentage
          ansible.builtin.shell: free | awk '/Swap:/ {if ($2 > 0) printf "%.0f", $3/$2 * 100; else print "0"}'
          register: swap_usage
          changed_when: false

        - name: Check CPU load average
          ansible.builtin.shell: uptime | awk '{print $(NF-2)}' | sed 's/,//'
          register: cpu_load
          changed_when: false

        - name: Get system uptime
          ansible.builtin.shell: uptime -p
          register: system_uptime
          changed_when: false

        - name: Check disk I/O wait
          ansible.builtin.shell: iostat -c 1 2 | awk '/^avg/ {print $4}'
          register: io_wait
          changed_when: false
          failed_when: false

    - name: Service checks
      block:
        - name: Check required services status
          ansible.builtin.systemd:
            name: "{{ item }}"
          check_mode: true
          loop: "{{ required_services }}"
          register: service_check
          ignore_errors: true

        - name: Get failed services count
          ansible.builtin.set_fact:
            failed_services: >-
              {{ service_check.results |
                 selectattr('status', 'defined') |
                 selectattr('status.ActiveState', '!=', 'active') |
                 map(attribute='item') |
                 list }}

        - name: Report failed services
          ansible.builtin.debug:
            msg: "⚠️ SERVICE DOWN: {{ failed_services | join(', ') }}"
          when: failed_services | length > 0

    - name: Docker health checks
      block:
        - name: Check Docker daemon
          ansible.builtin.command: docker info
          register: docker_info
          changed_when: false
          failed_when: false

        - name: Get running containers
          ansible.builtin.shell: docker ps --format '{{.Names}}'
          register: running_containers
          changed_when: false
          when: docker_info.rc == 0

        - name: Check container health status
          ansible.builtin.shell: |
            docker ps --format '{{.Names}}' | while read container; do
              health=$(docker inspect --format='{{.State.Health.Status}}' $container 2>/dev/null || echo "no-healthcheck")
              status=$(docker inspect --format='{{.State.Status}}' $container)
              echo "$container|$status|$health"
            done
          register: container_health
          changed_when: false
          when: docker_info.rc == 0 and running_containers.stdout_lines | length > 0

        - name: Parse container health
          ansible.builtin.set_fact:
            unhealthy_containers: >-
              {{ container_health.stdout_lines |
                 map('split', '|') |
                 selectattr('1', 'equalto', 'running') |
                 selectattr('2', 'equalto', 'unhealthy') |
                 map(attribute='0') |
                 list }}
          when: docker_info.rc == 0 and container_health.stdout is defined

        - name: Report unhealthy containers
          ansible.builtin.debug:
            msg: "⚠️ UNHEALTHY CONTAINERS: {{ unhealthy_containers | join(', ') }}"
          when:
            - docker_info.rc == 0
            - unhealthy_containers is defined
            - unhealthy_containers | length > 0

        - name: Get Docker disk usage
          ansible.builtin.command: docker system df --format '{{.Type}}\t{{.Size}}'
          register: docker_disk_usage
          changed_when: false
          when: docker_info.rc == 0
      when: "'docker' in required_services"

    - name: Network connectivity checks
      block:
        - name: Test network endpoints
          ansible.builtin.uri:
            url: "{{ item }}"
            timeout: 5
            status_code: [200, 301, 302]
          loop: "{{ network_test_urls }}"
          register: network_check
          ignore_errors: true

        - name: Get failed network tests
          ansible.builtin.set_fact:
            network_failures: >-
              {{ network_check.results |
                 selectattr('failed', 'equalto', true) |
                 map(attribute='item') |
                 list }}

        - name: Report network failures
          ansible.builtin.debug:
            msg: "⚠️ NETWORK UNREACHABLE: {{ network_failures | join(', ') }}"
          when: network_failures | length > 0

    - name: SSL certificate checks
      block:
        - name: Check SSL certificate expiry
          ansible.builtin.shell: |
            echo | timeout 5 openssl s_client -connect {{ ansible_fqdn }}:443 2>/dev/null | \
            openssl x509 -noout -dates 2>/dev/null | grep notAfter | cut -d= -f2
          register: ssl_expiry
          changed_when: false
          failed_when: false

        - name: Calculate days until SSL expiry
          ansible.builtin.shell: |
            expiry="{{ ssl_expiry.stdout }}"
            if [ -n "$expiry" ]; then
              expiry_epoch=$(date -d "$expiry" +%s)
              now_epoch=$(date +%s)
              days=$(( ($expiry_epoch - $now_epoch) / 86400 ))
              echo $days
            else
              echo "N/A"
            fi
          register: ssl_days_remaining
          changed_when: false
          when: ssl_expiry.stdout != ""

    - name: Generate health report
      block:
        - name: Create health report
          ansible.builtin.set_fact:
            health_report:
              timestamp: "{{ ansible_date_time.iso8601 }}"
              hostname: "{{ ansible_hostname }}"
              fqdn: "{{ ansible_fqdn }}"
              ip_address: "{{ ansible_default_ipv4.address }}"
              os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
              kernel: "{{ ansible_kernel }}"
              uptime: "{{ system_uptime.stdout }}"
              resources:
                disk_usage_percent: "{{ disk_usage.stdout }}"
                disk_status: >-
                  {% if disk_usage.stdout | int >= disk_critical_threshold | int %}CRITICAL
                  {% elif disk_usage.stdout | int >= disk_warning_threshold | int %}WARNING
                  {% else %}OK{% endif %}
                memory_usage_percent: "{{ memory_usage.stdout }}"
                memory_status: >-
                  {% if memory_usage.stdout | int >= memory_warning_threshold | int %}WARNING
                  {% else %}OK{% endif %}
                swap_usage_percent: "{{ swap_usage.stdout }}"
                cpu_load_1min: "{{ cpu_load.stdout }}"
                io_wait_percent: "{{ io_wait.stdout | default('N/A') }}"
              services:
                total: "{{ required_services | length }}"
                running: "{{ required_services | length - (failed_services | length) }}"
                failed: "{{ failed_services | default([]) }}"
              docker:
                daemon_running: "{{ docker_info.rc == 0 if docker_info is defined else false }}"
                containers_total: "{{ running_containers.stdout_lines | length if running_containers.stdout_lines is defined else 0 }}"
                containers_unhealthy: "{{ unhealthy_containers | default([]) }}"
                disk_usage: "{{ docker_disk_usage.stdout_lines | default([]) }}"
              network:
                connectivity_status: "{{ 'OK' if network_failures | length == 0 else 'DEGRADED' }}"
                failed_endpoints: "{{ network_failures | default([]) }}"
              ssl:
                expiry_date: "{{ ssl_expiry.stdout | default('N/A') }}"
                days_remaining: "{{ ssl_days_remaining.stdout | default('N/A') }}"

        - name: Display health report
          ansible.builtin.debug:
            var: health_report

        - name: Save health report to file
          ansible.builtin.copy:
            content: "{{ health_report | to_nice_yaml }}"
            dest: "/var/log/health-check-{{ ansible_date_time.epoch }}.yml"
            mode: "0644"

    - name: Alert on critical conditions
      block:
        - name: Alert - Critical disk usage
          ansible.builtin.fail:
            msg: "🚨 CRITICAL: Disk usage is {{ disk_usage.stdout }}% (threshold: {{ disk_critical_threshold }}%)"
          when:
            - fail_on_critical
            - disk_usage.stdout | int >= disk_critical_threshold | int

        - name: Alert - Failed services
          ansible.builtin.fail:
            msg: "🚨 CRITICAL: Services are down: {{ failed_services | join(', ') }}"
          when:
            - fail_on_critical
            - failed_services | length > 0

        - name: Alert - Unhealthy containers
          ansible.builtin.fail:
            msg: "🚨 CRITICAL: Unhealthy Docker containers: {{ unhealthy_containers | join(', ') }}"
          when:
            - fail_on_critical
            - unhealthy_containers is defined
            - unhealthy_containers | length > 0

    - name: Warnings
      block:
        - name: Warn - High disk usage
          ansible.builtin.debug:
            msg: "⚠️ WARNING: Disk usage is {{ disk_usage.stdout }}% (threshold: {{ disk_warning_threshold }}%)"
          when:
            - disk_usage.stdout | int >= disk_warning_threshold | int
            - disk_usage.stdout | int < disk_critical_threshold | int

        - name: Warn - High memory usage
          ansible.builtin.debug:
            msg: "⚠️ WARNING: Memory usage is {{ memory_usage.stdout }}% (threshold: {{ memory_warning_threshold }}%)"
          when: memory_usage.stdout | int >= memory_warning_threshold | int

        - name: Warn - SSL certificate expiring soon
          ansible.builtin.debug:
            msg: "⚠️ WARNING: SSL certificate expires in {{ ssl_days_remaining.stdout }} days"
          when:
            - ssl_days_remaining.stdout is defined
            - ssl_days_remaining.stdout != "N/A"
            - ssl_days_remaining.stdout | int < 30

  post_tasks:
    - name: Health check summary
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "  HEALTH CHECK SUMMARY"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "Server: {{ ansible_hostname }} ({{ ansible_default_ipv4.address }})"
          - "Disk: {{ disk_usage.stdout }}% ({{ health_report.resources.disk_status }})"
          - "Memory: {{ memory_usage.stdout }}% ({{ health_report.resources.memory_status }})"
          - "Services: {{ health_report.services.running }}/{{ health_report.services.total }} running"
          - "Docker: {{ health_report.docker.containers_total }} containers"
          - "Network: {{ health_report.network.connectivity_status }}"
          - "Overall: {{ '✅ HEALTHY' if health_report.resources.disk_status == 'OK' and failed_services | length == 0 else '⚠️ DEGRADED' }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
