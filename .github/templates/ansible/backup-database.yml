---
# PostgreSQL Database Backup
#
# This playbook backs up PostgreSQL databases with:
# - Compressed dumps
# - Automatic rotation (configurable retention)
# - Verification of backup files
# - Remote backup upload (optional)
#
# Usage:
#   ansible-playbook backup-database.yml
#
# Required Variables:
#   - databases: List of databases to backup
#
# Optional Variables:
#   - backup_retention_days: Days to keep backups (default: 7)
#   - remote_backup_enabled: Upload to remote storage (default: false)
#   - remote_backup_path: Remote destination (S3/NFS path)

- name: Backup PostgreSQL Databases
  hosts: database_servers
  become: true
  become_user: postgres
  gather_facts: true

  vars:
    # Backup configuration
    backup_dir: "/opt/backups/postgresql"
    backup_retention_days: 7

    # Databases to backup (override in inventory or playbook call)
    databases:
      - production_db
      - staging_db

    # Backup format: custom (-Fc) for best compression and flexibility
    backup_format: "Fc"

    # Remote backup (optional)
    remote_backup_enabled: false
    remote_backup_path: "s3://my-backups/postgresql/"

    # Notification (optional)
    notify_on_completion: false
    notification_webhook: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - databases is definedand databases | length > 0
        fail_msg: "databases variable must be defined with at least one database"

    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0700"
        owner: postgres
        group: postgres
      become_user: root

  tasks:
    - name: Database backup process
      block:
        - name: Generate timestamp for backup
          ansible.builtin.set_fact:
            backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
            backup_date: "{{ ansible_date_time.date }}"

        - name: Get database sizes before backup
          community.postgresql.postgresql_query:
            db: postgres
            query: >
              SELECT
                datname,
                pg_size_pretty(pg_database_size(datname)) as size
              FROM pg_database
              WHERE datname IN ({{ databases | map('quote') | join(',') }})
            login_user: postgres
          register: db_sizes

        - name: Display database sizes
          ansible.builtin.debug:
            msg: "{{ item.datname }}: {{ item.size }}"
          loop: "{{ db_sizes.query_result }}"

        - name: Create backup for each database
          community.postgresql.postgresql_db:
            name: "{{ item }}"
            state: dump
            target: "{{ backup_dir }}/{{ item }}_{{ backup_timestamp }}.dump"
            target_opts: "-{{ backup_format }}"
            login_user: postgres
          loop: "{{ databases }}"
          register: backup_result

        - name: Verify backup files exist and get sizes
          ansible.builtin.stat:
            path: "{{ backup_dir }}/{{ item }}_{{ backup_timestamp }}.dump"
          loop: "{{ databases }}"
          register: backup_files

        - name: Calculate total backup size
          ansible.builtin.set_fact:
            total_backup_size: "{{ backup_files.results | map(attribute='stat.size') | sum }}"

        - name: Display backup information
          ansible.builtin.debug:
            msg:
              - "Database: {{ item.item }}"
              - "Backup file: {{ item.stat.path }}"
              - "Size: {{ (item.stat.size / 1024 / 1024) | round(2) }} MB"
              - "Created: {{ item.stat.mtime | int | strftime('%Y-%m-%d %H:%M:%S') }}"
          loop: "{{ backup_files.results }}"
          when: item.stat.exists

        - name: Create backup manifest
          ansible.builtin.copy:
            content: |
              PostgreSQL Backup Manifest
              ==========================

              Backup Date: {{ ansible_date_time.iso8601 }}
              Server: {{ ansible_hostname }}

              Databases Backed Up:
              {% for db in databases %}
              - {{ db }}
              {% endfor %}

              Backup Files:
              {% for file in backup_files.results %}
              - {{ file.stat.path | basename }}: {{ (file.stat.size / 1024 / 1024) | round(2) }} MB
              {% endfor %}

              Total Size: {{ (total_backup_size / 1024 / 1024) | round(2) }} MB
              Retention: {{ backup_retention_days }} days
            dest: "{{ backup_dir }}/manifest_{{ backup_timestamp }}.txt"
            mode: "0644"
          become_user: root

        - name: Rotate old backups
          block:
            - name: Find old backup files
              ansible.builtin.find:
                paths: "{{ backup_dir }}"
                age: "{{ backup_retention_days }}d"
                patterns: "*.dump"
              register: old_backups

            - name: Find old manifest files
              ansible.builtin.find:
                paths: "{{ backup_dir }}"
                age: "{{ backup_retention_days }}d"
                patterns: "manifest_*.txt"
              register: old_manifests

            - name: Remove old backups
              ansible.builtin.file:
                path: "{{ item.path }}"
                state: absent
              loop: "{{ old_backups.files + old_manifests.files }}"
              when: (old_backups.matched + old_manifests.matched) > 0
              become_user: root

            - name: Report rotation results
              ansible.builtin.debug:
                msg: "Removed {{ old_backups.matched }} old backup files and {{ old_manifests.matched }} old manifests"

        - name: Upload to remote storage
          block:
            - name: Upload backups to S3
              ansible.builtin.command: >
                aws s3 sync
                {{ backup_dir }}/
                {{ remote_backup_path }}
                --exclude "*"
                --include "*{{ backup_date }}*"
              register: s3_upload
              become_user: root

            - name: Display upload result
              ansible.builtin.debug:
                var: s3_upload.stdout_lines
          when: remote_backup_enabled

        - name: Backup success summary
          ansible.builtin.set_fact:
            backup_summary:
              status: "SUCCESS"
              timestamp: "{{ backup_timestamp }}"
              databases: "{{ databases }}"
              total_size_mb: "{{ (total_backup_size / 1024 / 1024) | round(2) }}"
              files_backed_up: "{{ backup_files.results | length }}"
              old_files_removed: "{{ old_backups.matched | default(0) }}"
              remote_upload: "{{ 'Completed' if remote_backup_enabled else 'Disabled' }}"

        - name: Display success summary
          ansible.builtin.debug:
            var: backup_summary

      rescue:
        - name: Backup failed
          ansible.builtin.set_fact:
            backup_summary:
              status: "FAILED"
              timestamp: "{{ backup_timestamp | default('N/A') }}"
              error: "{{ ansible_failed_result.msg | default('Unknown error') }}"

        - name: Display failure summary
          ansible.builtin.debug:
            var: backup_summary

        - name: Cleanup partial backups
          ansible.builtin.find:
            paths: "{{ backup_dir }}"
            patterns: "*{{ backup_timestamp | default('') }}*"
          register: partial_backups
          when: backup_timestamp is defined

        - name: Remove partial backup files
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ partial_backups.files }}"
          when: partial_backups.matched > 0
          become_user: root

        - name: Fail playbook
          ansible.builtin.fail:
            msg: "Database backup failed: {{ ansible_failed_result.msg | default('Unknown error') }}"

      always:
        - name: Log backup result
          ansible.builtin.lineinfile:
            path: "/var/log/postgresql-backups.log"
            line: "{{ ansible_date_time.iso8601 }} - {{ backup_summary.status }} - Databases: {{ databases | join(', ') }} - Size: {{ backup_summary.total_size_mb | default('N/A') }} MB"
            create: true
            mode: "0644"
          become_user: root

  post_tasks:
    - name: Send notification
      ansible.builtin.uri:
        url: "{{ notification_webhook }}"
        method: POST
        body_format: json
        body:
          text: |
            PostgreSQL Backup {{ backup_summary.status }}
            Server: {{ ansible_hostname }}
            Databases: {{ databases | join(', ') }}
            Size: {{ backup_summary.total_size_mb | default('N/A') }} MB
            Time: {{ ansible_date_time.iso8601 }}
        status_code: 200
      when: notify_on_completion
      delegate_to: localhost
      ignore_errors: true
