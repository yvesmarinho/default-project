---
# Zero-Downtime Application Deployment
#
# This playbook deploys an application with zero downtime by:
# - Removing server from load balancer
# - Stopping application gracefully
# - Deploying new version
# - Running health checks
# - Adding server back to load balancer
#
# Usage:
#   ansible-playbook deploy-app.yml -e "app_version=1.2.3"
#
# Required Variables:
#   - app_version: Version to deploy (can be passed with -e)
#
# Optional Variables:
#   - skip_health_check: Skip health checks (default: false)
#   - health_check_retries: Number of health check attempts (default: 10)

- name: Deploy Application with Zero Downtime
  hosts: app_servers
  become: true
  serial: 1  # Deploy one server at a time for zero downtime
  gather_facts: true
  
  vars:
    # Application configuration
    app_name: "myapp"
    app_version: "{{ deployment_version | default('latest') }}"
    app_user: "appuser"
    app_group: "appgroup"
    app_path: "/opt/{{ app_name }}"
    app_port: 8080
    
    # Health check configuration
    health_check_url: "http://localhost:{{ app_port }}/health"
    health_check_retries: 10
    health_check_delay: 5
    skip_health_check: false
    
    # Load balancer configuration
    lb_api_url: "http://loadbalancer.internal:9000/api"
    
    # Artifact repository
    artifact_url: "https://artifacts.company.com/{{ app_name }}/{{ app_version }}/{{ app_name }}.jar"
  
  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - app_version is defined
          - app_version != ""
          - app_version != "latest" or allow_latest | default(false)
        fail_msg: "app_version must be specified (use -e 'app_version=1.2.3')"
    
    - name: Display deployment information
      ansible.builtin.debug:
        msg:
          - "Deploying {{ app_name }} version {{ app_version }}"
          - "Target: {{ inventory_hostname }}"
          - "Time: {{ ansible_date_time.iso8601 }}"
  
  tasks:
    - name: Deployment process
      block:
        - name: Remove server from load balancer
          ansible.builtin.uri:
            url: "{{ lb_api_url }}/servers/{{ inventory_hostname }}/disable"
            method: POST
            status_code: [200, 404]  # 404 if server not in LB
            timeout: 10
          delegate_to: localhost
          register: lb_remove
          ignore_errors: true
        
        - name: Wait for active connections to drain
          ansible.builtin.pause:
            seconds: 30
            prompt: "Waiting for connections to drain..."
        
        - name: Stop application service
          ansible.builtin.systemd:
            name: "{{ app_name }}"
            state: stopped
          register: app_stopped
        
        - name: Verify application stopped
          ansible.builtin.wait_for:
            port: "{{ app_port }}"
            state: stopped
            timeout: 60
        
        - name: Backup current version
          ansible.builtin.copy:
            src: "{{ app_path }}/{{ app_name }}.jar"
            dest: "{{ app_path }}/{{ app_name }}.jar.backup-{{ ansible_date_time.epoch }}"
            remote_src: true
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            mode: '0644'
          when: app_stopped.changed
          ignore_errors: true
        
        - name: Download new version
          ansible.builtin.get_url:
            url: "{{ artifact_url }}"
            dest: "{{ app_path }}/{{ app_name }}.jar"
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            mode: '0644'
            timeout: 300
          register: download_result
        
        - name: Start application service
          ansible.builtin.systemd:
            name: "{{ app_name }}"
            state: started
            enabled: true
          register: app_started
        
        - name: Wait for application port to be available
          ansible.builtin.wait_for:
            port: "{{ app_port }}"
            state: started
            delay: 5
            timeout: 120
        
        - name: Health check - verify application is healthy
          ansible.builtin.uri:
            url: "{{ health_check_url }}"
            status_code: 200
            timeout: 5
          register: health_check
          until: health_check.status == 200
          retries: "{{ health_check_retries }}"
          delay: "{{ health_check_delay }}"
          when: not skip_health_check
        
        - name: Get deployed version info
          ansible.builtin.uri:
            url: "{{ health_check_url }}"
            return_content: true
          register: version_info
          when: not skip_health_check
        
        - name: Add server back to load balancer
          ansible.builtin.uri:
            url: "{{ lb_api_url }}/servers/{{ inventory_hostname }}/enable"
            method: POST
            status_code: [200, 404]
            timeout: 10
          delegate_to: localhost
          ignore_errors: true
        
        - name: Deployment success
          ansible.builtin.debug:
            msg:
              - "✅ Deployment successful!"
              - "Version: {{ app_version }}"
              - "Server: {{ inventory_hostname }}"
              - "Health Status: {{ health_check.status | default('skipped') }}"
      
      rescue:
        - name: Deployment failed - initiating rollback
          ansible.builtin.debug:
            msg: "❌ Deployment failed, rolling back to previous version"
        
        - name: Stop failed deployment
          ansible.builtin.systemd:
            name: "{{ app_name }}"
            state: stopped
          ignore_errors: true
        
        - name: Find latest backup
          ansible.builtin.find:
            paths: "{{ app_path }}"
            patterns: "{{ app_name }}.jar.backup-*"
            age: -1h
          register: backup_files
        
        - name: Restore previous version
          ansible.builtin.copy:
            src: "{{ backup_files.files | sort(attribute='mtime') | last | default({}) | json_query('path') }}"
            dest: "{{ app_path }}/{{ app_name }}.jar"
            remote_src: true
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
          when: backup_files.matched > 0
        
        - name: Restart with previous version
          ansible.builtin.systemd:
            name: "{{ app_name }}"
            state: started
        
        - name: Ensure server is back in load balancer after failure
          ansible.builtin.uri:
            url: "{{ lb_api_url }}/servers/{{ inventory_hostname }}/enable"
            method: POST
            status_code: [200, 404]
          delegate_to: localhost
          ignore_errors: true
        
        - name: Fail deployment
          ansible.builtin.fail:
            msg: "Deployment failed and rolled back to previous version"
      
      always:
        - name: Cleanup old backups (keep last 5)
          ansible.builtin.shell: |
            cd {{ app_path }}
            ls -t {{ app_name }}.jar.backup-* 2>/dev/null | tail -n +6 | xargs -r rm
          args:
            warn: false
          changed_when: false
  
  post_tasks:
    - name: Wait before next server deployment
      ansible.builtin.pause:
        seconds: 10
      when: inventory_hostname != ansible_play_hosts[-1]  # Not last server
