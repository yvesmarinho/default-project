# docker-compose.airflow.yml — Local Airflow development stack
# Usage: docker compose -f docker-compose.airflow.yml up
#
# Services: airflow-webserver, airflow-scheduler, airflow-worker,
#           postgres (metadata DB), redis (Celery broker, optional)
#
# Credentials: load from .secrets/.env.airflow (never hardcoded here)

version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  env_file:
    - .secrets/.env.airflow
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: airflow
    secrets:
      - pg_password
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username $${_AIRFLOW_WWW_USER_USERNAME}
          --password $${_AIRFLOW_WWW_USER_PASSWORD}
          --firstname Admin --lastname User
          --role Admin --email admin@example.com
        || true
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
  airflow-logs:

secrets:
  pg_password:
    file: .secrets/pg_password.txt
