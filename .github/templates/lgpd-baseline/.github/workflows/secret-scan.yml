name: Secret Scanning — LGPD Baseline

# Detecta credenciais e dados sensíveis acidentalmente commitados.
# Parte do perfil lgpd-baseline: prevenção de vazamentos por supply chain.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Scan diário às 03:00 UTC (detecta segredos introduzidos fora do fluxo normal)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # para upload de SARIF (se habilitado)

jobs:
  secret-scan:
    name: Scan — Segredos e Dados Sensíveis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          # Fetch histórico completo para detectar segredos em commits antigos
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 1. Gitleaks — scanner de segredos open source mais completo
      # ------------------------------------------------------------------
      - name: Gitleaks — Scan de segredos no git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Para repositórios privados, o plano free do Gitleaks Action é suficiente.
          # Para orgs, considere: GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # ------------------------------------------------------------------
      # 2. TruffleHog — scanner complementar com entropia + regex
      # ------------------------------------------------------------------
      - name: TruffleHog — Scan de alta entropia
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: >-
            --only-verified
            --fail

      # ------------------------------------------------------------------
      # 3. Padrões customizados LGPD — CPF, RG, CNH, dados sensíveis BR
      # ------------------------------------------------------------------
      - name: Scan de PII Brasileira (CPF, RG, e-mail, telefone em código)
        run: |
          echo "Verificando padrões de PII hardcoded no código..."

          # CPF em formato válido (000.000.000-00 ou 00000000000)
          if grep -rn --include="*.py" --include="*.js" --include="*.ts" \
               --include="*.json" --include="*.yaml" --include="*.yml" \
               -E '\b([0-9]{3}[\.\-]?[0-9]{3}[\.\-]?[0-9]{3}[\.\-]?[0-9]{2})\b' \
               --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir=".venv" \
               . | grep -v "example\|test\|fake\|mock\|000\.000\.000-00\|XXX"; then
            echo "⚠️  AVISO: Possíveis CPFs reais detectados no código."
            echo "   Verifique se são dados de exemplo ou dados reais commitados."
            # Não falha automaticamente — alguns são fixtures de teste
            # Mude para 'exit 1' se quiser falha mandatória
          else
            echo "✅ Nenhum padrão de CPF suspeito encontrado."
          fi

          # Chaves AWS hardcoded
          if grep -rn --include="*.py" --include="*.js" --include="*.ts" \
               --include="*.env" --include="*.yaml" --include="*.yml" \
               -E 'AKIA[0-9A-Z]{16}' \
               --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir=".venv" \
               . ; then
            echo "❌ ERRO: Chave AWS (AKIA...) detectada no código!"
            exit 1
          fi

          echo "✅ Scan de PII brasileira concluído."

      # ------------------------------------------------------------------
      # 4. Verificar .env files não devem estar rastreados pelo git
      # ------------------------------------------------------------------
      - name: Verificar .env files no gitignore
        run: |
          TRACKED_ENV=$(git ls-files | grep -E '^\.env(\.|$)' || true)
          if [ -n "$TRACKED_ENV" ]; then
            echo "❌ ERRO: Arquivos .env estão sendo rastreados pelo git:"
            echo "$TRACKED_ENV"
            echo "Execute: git rm --cached $TRACKED_ENV"
            exit 1
          fi
          echo "✅ Nenhum .env rastreado pelo git."

      # ------------------------------------------------------------------
      # 5. Dependency audit — vulnerabilidades em dependências
      # ------------------------------------------------------------------
      - name: Python — pip-audit (SBOM + CVEs)
        if: hashFiles('**/pyproject.toml', '**/requirements*.txt') != ''
        run: |
          pip install pip-audit --quiet
          if [ -f "pyproject.toml" ]; then
            pip-audit --requirement <(pip install uv -q && uv export 2>/dev/null || pip freeze) \
              --disable-pip --output-format columns || true
          elif [ -f "requirements.txt" ]; then
            pip-audit -r requirements.txt --output-format columns || true
          fi

      - name: Node.js — npm audit
        if: hashFiles('**/package.json') != ''
        run: |
          if [ -f "package.json" ]; then
            npm audit --audit-level=high || echo "⚠️  npm audit encontrou vulnerabilidades high/critical"
          fi

  # --------------------------------------------------------------------------
  # Notificação (opcional — configure SLACK_WEBHOOK em Secrets)
  # --------------------------------------------------------------------------
  notify-on-failure:
    name: Notificar falha
    runs-on: ubuntu-latest
    needs: [secret-scan]
    if: failure() && github.event_name != 'pull_request'
    steps:
      - name: Notificar via Slack
        if: env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_SECURITY_WEBHOOK }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"🚨 *Secret Scan falhou* em \`${{ github.repository }}\`\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Branch\", \"value\": \"\`${{ github.ref_name }}\`\", \"short\": true},
                  {\"title\": \"Commit\", \"value\": \"\`${{ github.sha }}\`\", \"short\": true},
                  {\"title\": \"Workflow\", \"value\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}
                ]
              }]
            }"
