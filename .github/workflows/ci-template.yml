name: CI — Template Test Suite

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "profile-descriptors/**"
      - ".github/workflows/ci-template.yml"
      - "pytest.ini"
      - "pyproject.toml"
  push:
    branches:
      - main
      - master
    paths:
      - "scripts/**"
      - "tests/**"
      - "profile-descriptors/**"
      - ".github/workflows/ci-template.yml"
      - "pytest.ini"
      - "pyproject.toml"

# Cancela runs anteriores do mesmo PR/branch para economizar minutos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Suite completa de testes (pytest tests/)
  # ---------------------------------------------------------------------------
  test:
    name: "pytest ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml',
            'pytest.ini') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-

      - name: Install test dependencies
        run: pip install pytest pytest-cov rich pyyaml

      - name: Run full test suite
        run: |
          pytest tests/ --tb=short -q \
            --cov=src \
            --cov=scripts/lib \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80

  # ---------------------------------------------------------------------------
  # Job 2: Smoke de integração CLI (scaffold.py sem dependências extras)
  # ---------------------------------------------------------------------------
  cli-smoke:
    name: CLI smoke (--list-profiles + --dry-run + --publish)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CLI dependencies
        run: pip install rich pyyaml

      - name: scaffold --list-profiles --json
        run: |
          python scripts/scaffold.py --list-profiles --json | python -c "
          import json, sys
          data = json.load(sys.stdin)
          assert isinstance(data, list), f'Expected list, got {type(data)}'
          assert len(data) > 0, 'Profile list is empty'
          print(f'OK: {len(data)} profiles found')
          "

      - name: scaffold --dry-run (Python/programming)
        run: |
          python scripts/scaffold.py \
            --dry-run --json --ci \
            --name smoke-test \
            --domain programming \
            --language python | python -c "
          import json, sys
          data = json.load(sys.stdin)
          assert data.get('dry_run') is True, 'dry_run flag missing'
          assert len(data.get('manifest', [])) > 0, 'empty manifest'
          print(f'OK: dry-run manifest has {len(data[\"manifest\"])} ops')
          "

      - name: scaffold --publish --json
        run: |
          python scripts/scaffold.py --publish --json --output-dir /tmp/template-release | python -c "
          import json, sys, os
          data = json.load(sys.stdin)
          assert data.get('success') is True, f'publish failed: {data}'
          assert data.get('file_count', 0) > 0, 'file_count is 0'
          assert os.path.exists(data['tarball']), f'tarball not found: {data[\"tarball\"]}'
          print(f'OK: tarball with {data[\"file_count\"]} files ({data[\"size_bytes\"]} bytes)')
          "

      - name: Verify sbom target in Layer 2 Makefile templates
        run: |
          for template in python-fastapi python-flask; do
            grep -q "^sbom:" .github/templates/${template}/Makefile \
              || (echo "ERROR: sbom target missing in ${template}/Makefile" && exit 1)
          done
          grep -q "^sbom:" .github/templates/typescript-next/Makefile \
            || (echo "ERROR: sbom target missing in typescript-next/Makefile" && exit 1)
          echo "OK: sbom target present in all Layer 2 Makefile templates"

  # ---------------------------------------------------------------------------
  # Job 3: Lint — verifica que scaffold.py e lib/*.py são válidos sintaticamente
  # ---------------------------------------------------------------------------
  lint:
    name: Syntax check (py_compile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: pip install pyyaml

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/scaffold.py
          python -m py_compile scripts/lib/composer.py
          python -m py_compile scripts/lib/config.py
          python -m py_compile scripts/lib/git.py
          python -m py_compile scripts/lib/infra.py
          python -m py_compile scripts/lib/links.py
          python -m py_compile scripts/lib/project.py
          python -m py_compile scripts/lib/publish.py
          python -m py_compile scripts/lib/release.py
          python -m py_compile scripts/lib/templates.py
          python -m py_compile scripts/lib/ui.py
          python -m py_compile scripts/lib/validate.py
          python -m py_compile scripts/lib/vscode.py
          python -m py_compile scripts/lib/flows/__init__.py
          python -m py_compile scripts/lib/flows/check_links.py
          python -m py_compile scripts/lib/flows/compose.py
          python -m py_compile scripts/lib/flows/dry_run.py
          python -m py_compile scripts/lib/flows/generate_infra.py
          python -m py_compile scripts/lib/flows/generate_rules.py
          python -m py_compile scripts/lib/flows/list_profiles.py
          python -m py_compile scripts/lib/flows/new_profile.py
          python -m py_compile scripts/lib/flows/new_project.py
          python -m py_compile scripts/lib/flows/publish.py
          python -m py_compile scripts/lib/flows/release.py
          python -m py_compile scripts/lib/flows/upgrade.py
          python -m py_compile scripts/lib/flows/validate.py
          echo "All Python files are syntactically valid."

      - name: Check profile descriptors are valid YAML
        run: |
          python -c "
          import yaml, sys
          from pathlib import Path
          errors = []
          for f in sorted(Path('profile-descriptors').glob('*.yaml')):
              try:
                  yaml.safe_load(f.read_text(encoding='utf-8'))
              except yaml.YAMLError as e:
                  errors.append(f'{f.name}: {e}')
          if errors:
              print('YAML errors:')
              for e in errors: print(' ', e)
              sys.exit(1)
          print(f'OK: {len(list(Path(\"profile-descriptors\").glob(\"*.yaml\")))} YAML files valid')
          "
  # ---------------------------------------------------------------------------
  # Job 4: Integration — testa estrutura e segurança de TODOS os templates
  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests (template structure + security)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run integration tests
        run: |
          pytest tests/test_integration_structural.py tests/test_integration_security.py \
            -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 5: Staleness check — avisa (warning, não falha) se descriptors > 90 dias
  # ---------------------------------------------------------------------------
  staleness:
    name: Staleness check (profile-descriptors)
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true # warning-only: nunca bloqueia o pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check descriptor staleness (>90 days warning)
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, 'scripts')
          from lib.validate import validate_descriptors
          from pathlib import Path

          report = validate_descriptors(
              Path('profile-descriptors'),
              stale_days_threshold=90,
          )

          stale = report.stale_profiles
          if stale:
              for name in stale:
                  # Emite annotation de warning no GitHub Actions
                  print(f'::warning file=profile-descriptors/{name}.yaml::'
                        f'Descriptor "{name}" está desatualizado (last_tested > 90 dias)')
              print(f'\nSUMARIO: {len(stale)} descriptor(s) desatualizado(s):')
              for name in stale:
                  print(f'  - {name}')
              # Exit 1 para marcar o step como failure visual (job não bloqueia por continue-on-error)
              sys.exit(1)
          else:
              print(f'OK: todos os {report.profiles_checked} descriptors estão atualizados '
                    f'(threshold: {report.stale_days_threshold} dias)')
          EOF
