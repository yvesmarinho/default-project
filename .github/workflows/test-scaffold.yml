name: Test Scaffold

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "pytest.ini"
  push:
    branches:
      - main
      - master
    paths:
      - "scripts/**"
      - "tests/**"

jobs:
  test:
    name: Smoke + Snapshot Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest rich

      - name: Run smoke tests
        run: pytest tests/test_smoke.py -v

      - name: Run snapshot tests
        run: pytest tests/test_templates_snapshot.py -v
