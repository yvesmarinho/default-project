name: Test Scaffold

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "pytest.ini"
  push:
    branches:
      - main
      - master
    paths:
      - "scripts/**"
      - "tests/**"

jobs:
  test:
    name: Smoke + Snapshot Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pytest-cov rich pyyaml

      - name: Run full test suite
        run: pytest tests/ --tb=short -q --no-header
