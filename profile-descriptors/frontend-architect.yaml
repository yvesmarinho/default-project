schema_version: "1.0.0"

name: frontend-architect
layer: 2
version: "1.0.0"
last_tested: "2026-04-14"
status: stable

description: >
  Perfil Layer 2 para arquiteto frontend. Combina expertise em arquitetura de
  aplicações frontend (SPA, SSR, SSG), state management, performance optimization,
  design systems implementation, e decisões técnicas de longo prazo. Ideal para
  projetos que exigem escalabilidade frontend, componentização avançada, e
  alinhamento entre UI/UX design e implementação técnica.

meta:
  maintained_by: "@yves_marinho"
  language: typescript-javascript
  framework: react-vue-angular
  tags:
    - frontend-architecture
    - spa
    - state-management
    - performance
    - design-systems-implementation
    - component-architecture
    - layer2

expertise_domains:
  frontend_architecture_patterns:
    - SPA (Single Page Application) vs MPA (Multi Page Application)
    - SSR (Server-Side Rendering) vs SSG (Static Site Generation) vs CSR (Client-Side Rendering)
    - Micro-frontends (module federation, independent deployment, team autonomy)
    - Component architecture (atomic design, container/presentational components)
    - State management patterns (Flux, Redux, MobX, Zustand, Context API)
    - Code splitting and lazy loading (dynamic imports, route-based splitting)
    - Module bundling strategies (Webpack, Vite, Rollup, esbuild)
    - Monorepo vs polyrepo (Nx, Turborepo, Lerna)

  state_management:
    - Global state (Redux, MobX, Zustand, Recoil)
    - Local state (React useState, Vue reactive)
    - Server state (React Query, SWR, Apollo Client)
    - URL state (React Router, Next.js router, query params)
    - Form state (Formik, React Hook Form, controlled vs uncontrolled)
    - State normalization (denormalized vs normalized, cache strategies)
    - State persistence (localStorage, sessionStorage, IndexedDB)
    - State machines (XState, finite state machines for complex flows)

  performance_optimization:
    - Core Web Vitals (LCP, FID, CLS, INP)
    - Bundle size optimization (tree shaking, code splitting, dynamic imports)
    - Rendering optimization (React.memo, useMemo, useCallback, shouldComponentUpdate)
    - Image optimization (WebP, AVIF, lazy loading, srcset, next/image)
    - Font optimization (font-display, variable fonts, subsetting)
    - Caching strategies (service workers, HTTP caching, stale-while-revalidate)
    - JavaScript execution optimization (debounce, throttle, requestIdleCallback)
    - Critical rendering path (inline critical CSS, defer non-critical JS)

  design_systems_implementation:
    - Component library development (Storybook, Chromatic)
    - Design tokens integration (CSS custom properties, Tailwind config, Style Dictionary)
    - Accessibility implementation (ARIA, keyboard navigation, focus management)
    - Theming (CSS-in-JS, CSS modules, Tailwind theming)
    - Component API design (props, composition, render props, compound components)
    - Versioning and distribution (npm packages, monorepo, semantic versioning)
    - Documentation (Storybook docs, MDX, usage guidelines)
    - Testing strategies (unit tests, visual regression testing, accessibility testing)

  build_and_tooling:
    - Build tools (Webpack, Vite, Rollup, esbuild, Turbopack)
    - Package managers (npm, yarn, pnpm)
    - Linters and formatters (ESLint, Prettier, TypeScript strict mode)
    - Testing frameworks (Jest, Vitest, React Testing Library, Cypress, Playwright)
    - CI/CD for frontend (GitHub Actions, GitLab CI, Netlify, Vercel)
    - Deployment strategies (preview deployments, canary releases, blue-green)
    - Monitoring and observability (Sentry, LogRocket, Datadog RUM)
    - Feature flags (LaunchDarkly, Statsig, environment-based flags)

stack:
  frameworks:
    - React >= 18 (preferred)
    - Next.js >= 13 (App Router)
    - Vue 3 (Composition API)
    - Angular >= 15 (Standalone components)
  
  state_management:
    - Redux Toolkit
    - React Query / TanStack Query
    - Zustand
    - MobX
  
  styling:
    - Tailwind CSS
    - CSS Modules
    - Styled-components / Emotion
    - SCSS/Sass
  
  build_tools:
    - Vite (preferred for new projects)
    - Webpack 5
    - Turbopack (Next.js)

combines_with:
  - ui-design-expert
  - ux-design-expert
  - typescript-next
  - backend-architect
  - qa-automation-engineer

templates_path: ".github/templates/frontend-architect"

templates:
  - path: "frontend/architecture-decision-record.md"
    description: "ADR template for frontend decisions: state management, routing, styling"

  - path: "frontend/component-api-spec.md"
    description: "Component API specification: props, events, slots, composition"

  - path: "frontend/performance-budget.yaml"
    description: "Performance budget: bundle size, Core Web Vitals, load time targets"

  - path: "frontend/design-tokens-integration.md"
    description: "Design tokens integration guide: Figma → code, CSS custom properties"

workflows:
  component_architecture:
    - name: "Design System Component Development"
      steps:
        - "Design: collaborate with UI/UX on Figma components, variants, states"
        - "API design: define props interface, composition patterns, accessibility"
        - "Implementation: build component in Storybook, document usage"
        - "Testing: unit tests (Jest), visual regression (Chromatic), accessibility (axe)"
        - "Review: design-dev pairing, code review, accessibility audit"
        - "Distribution: publish to npm (if package) or monorepo (if internal)"
        - "Documentation: Storybook docs, usage guidelines, migration guide"

  performance_optimization:
    - name: "Frontend Performance Optimization"
      steps:
        - "Baseline: measure Core Web Vitals (Lighthouse, PageSpeed Insights)"
        - "Analyze: bundle analysis (webpack-bundle-analyzer), network waterfall"
        - "Optimize: code splitting, lazy loading, image optimization, font optimization"
        - "Caching: service worker, HTTP caching headers, CDN configuration"
        - "Measure: re-run Lighthouse, validate improvements (LCP, FID, CLS)"
        - "Monitor: Real User Monitoring (RUM) via Datadog, Sentry Performance"

best_practices:
  - "Principle: Component composition over inheritance"
  - "Principle: Single responsibility per component"
  - "Principle: Accessibility first (WCAG 2.1 AA, semantic HTML, ARIA)"
  - "Principle: Performance budget (bundle size <200KB, LCP <2.5s, CLS <0.1)"
  - "Principle: Progressive enhancement (works without JS, enhanced with JS)"
  - "Principle: Mobile-first responsive design"
  - "Principle: Type safety (TypeScript strict mode, prop types)"
  - "Principle: Test coverage (>80% for critical components)"
  - "Principle: Design-dev collaboration (design systems bridge gap)"
  - "Principle: Semantic versioning for libraries (breaking changes = major version)"

examples:
  - name: "E-commerce SPA with Next.js + React Query"
    bounded_contexts:
      - "Rendering: SSG for product pages (SEO), SSR for user dashboard (personalization)"
      - "State: React Query for server state (products, cart), Zustand for UI state (sidebar open)"
      - "Performance: Image optimization (next/image), code splitting (dynamic imports)"
      - "Styling: Tailwind CSS + CSS Modules for scoped styles"
      - "Testing: Jest + React Testing Library (unit), Playwright (E2E)"
    
    adrs:
      - id: "ADR-FE-001"
        title: "Use Next.js App Router instead of Pages Router"
        rationale: "App Router has better performance (React Server Components), improved DX (colocation), future-proof"
      
      - id: "ADR-FE-002"
        title: "Use React Query for server state, Zustand for UI state"
        rationale: "React Query handles caching, re-fetching, optimistic updates; Zustand is lightweight for simple UI state"

quality_gates:
  - "Architecture diagram exists (component hierarchy, data flow)"
  - "Performance budget defined (bundle size, Core Web Vitals targets)"
  - "Design system implemented (>20 components, Storybook documentation)"
  - "TypeScript strict mode enabled, zero type errors"
  - "Test coverage >= 80% for critical components"
  - "Accessibility audit passing (WCAG 2.1 AA, axe DevTools)"
  - "Lighthouse score >= 90 (Performance, Accessibility, Best Practices, SEO)"
  - "ADRs documented for major architectural decisions"
