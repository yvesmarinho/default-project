# ============================================================
# Profile Descriptor — python-flask
# Layer 2 — sobre devops-programming (language: python)
# Schema versão 1.0.0
# ============================================================

name: python-flask
description: >
  Layer 2 para projetos Python Flask. Gera application factory com blueprints,
  flask-wtf (CSRF), flask-talisman (security headers), pytest com test_client,
  Dockerfile multistage com uv sync --frozen e Makefile com targets dev/test/lint/audit/security.

VERSION: "1.0.0"
LAST_TESTED_DATE: "2026-03-07"

requires:
  - "python >= 3.11"
  - "uv installed"
  - "language == python"
  - "domain == programming"
  - "docker installed" # opcional — para docker-build/docker-up

generates:
  files:
    - path: "src/app.py"
      source: ".github/templates/python-flask/src/app.py"
      description: "Application factory create_app() com blueprints + extensões"
      required: true
      when: null

    - path: "src/core/__init__.py"
      source: "inline (vazio)"
      description: "Pacote core"
      required: true
      when: null

    - path: "src/core/config.py"
      source: ".github/templates/python-flask/src/core/config.py"
      description: "Config classes: Development/Production/Testing com SECRET_KEY obrigatório"
      required: true
      when: null

    - path: "src/extensions.py"
      source: ".github/templates/python-flask/src/extensions.py"
      description: "Instâncias CSRFProtect + Talisman (init_app pattern)"
      required: true
      when: null

    - path: "src/blueprints/__init__.py"
      source: "inline (vazio)"
      description: "Pacote blueprints"
      required: true
      when: null

    - path: "src/blueprints/health/__init__.py"
      source: ".github/templates/python-flask/src/blueprints/health/__init__.py"
      description: "Re-export do health_bp"
      required: true
      when: null

    - path: "src/blueprints/health/routes.py"
      source: ".github/templates/python-flask/src/blueprints/health/routes.py"
      description: "GET /health — smoke endpoint com Blueprint"
      required: true
      when: null

    - path: "tests/conftest.py"
      source: ".github/templates/python-flask/tests/conftest.py"
      description: "Fixtures app (TestingConfig) + client (test_client)"
      required: true
      when: null

    - path: "tests/test_health.py"
      source: ".github/templates/python-flask/tests/test_health.py"
      description: "Smoke test do endpoint GET /health"
      required: true
      when: null

    - path: "pyproject.toml"
      source: ".github/templates/python-flask/pyproject.toml"
      description: "PEP 621: flask, flask-wtf, flask-talisman, pytest, ruff, bandit, pip-audit"
      required: true
      when: null

    - path: ".env.example"
      source: ".github/templates/python-flask/.env.example"
      description: "Variáveis de ambiente documentadas sem valores reais"
      required: true
      when: null

    - path: "Dockerfile"
      source: ".github/templates/python-flask/Dockerfile"
      description: "Multistage: builder (uv sync --frozen --no-dev) + runtime (usuário não-root, gunicorn)"
      required: true
      when: null

    - path: "docker-compose.yml"
      source: ".github/templates/python-flask/docker-compose.yml"
      description: "Serviços: app + postgres:16 com healthcheck"
      required: true
      when: null

    - path: "Makefile"
      source: ".github/templates/python-flask/Makefile"
      description: "Targets: install, dev, test, lint, format, audit, security, docker-*, ci, clean"
      required: true
      when: null

    - path: ".github/prompts/domain/layer2-python-flask.prompt.md"
      source: ".github/prompts/domain/layer2-python-flask.prompt.md"
      description: "Domain profile: convenções Flask, blueprints, CSRF, security headers, testes"
      required: true
      when: null

  patches:
    - file: ".gitignore"
      description: "Adiciona .env, .venv/, __pycache__/, htmlcov/, .coverage, instance/"
      operation: "append"

    - file: "docs/TODO.md"
      description: "Adiciona checklist de primeiro deploy Flask (SECRET_KEY, CSRF, Talisman, HTTPS)"
      operation: "append"

excludes_with:
  - python-fastapi # dois frameworks Python no mesmo projeto é conflito
  - devops-infrastructure
  - devops-analysis

combines_with:
  - name: devops-programming
    notes: "Obrigatório — este perfil é Layer 2 sobre devops-programming"
  - name: devops-security
    notes: "Sempre combinado — transversal"

security:
  enforces:
    - "SECRET_KEY via variável de ambiente obrigatória (sem default)"
    - "flask-talisman: HSTS, X-Frame-Options, X-Content-Type-Options"
    - "flask-wtf CSRFProtect: WTF_CSRF_ENABLED=True em produção"
    - "SESSION_COOKIE_SECURE=True, HTTPONLY=True, SAMESITE=Lax em produção"
    - "bandit -r src/ disponível via 'make security'"
    - "pip-audit disponível via 'make audit'"
    - "Dockerfile executa como usuário não-root (adduser app)"
    - "uv sync --frozen --no-dev na imagem de produção (sem deps dev)"
    - "POSTGRES_PASSWORD via variável de ambiente obrigatória no docker-compose"

tags:
  - python
  - flask
  - web
  - api
  - blueprints
  - csrf
  - layer2
  - uv
  - docker

layer: layer2
maintainer: "template-architect"
