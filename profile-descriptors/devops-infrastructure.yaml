# ============================================================
# Profile Descriptor — Enterprise Default Project Template
# Schema versão 1.0.0
# ============================================================

# ------------------------------------------------------------------
# Identificação
# ------------------------------------------------------------------
name: devops-infrastructure
description: >
  Perfil base para projetos de infraestrutura como código (IaC), containers,
  orquestração Kubernetes e provisionamento cloud.
  Estrutura de pastas orientada a infra (terraform/, k8s/, helm/).
  Não compatível com devops-programming (convenções de src/) e
  devops-analysis (convenções de dados/notebooks).

VERSION: "1.0.0"
LAST_TESTED_DATE: "2026-03-14"

# ------------------------------------------------------------------
# Dependências
# ------------------------------------------------------------------
requires:
  - "git installed"
  # Ferramentas recomendadas:
  # - terraform >= 1.5
  # - kubectl >= 1.27
  # - helm >= 3.12
  # - docker >= 24

# ------------------------------------------------------------------
# Artefatos gerados
# ------------------------------------------------------------------
generates:
  files:
    - path: ".github/prompts/domain/devops-infrastructure.prompt.md"
      source: ".copilot-shared/.github/prompts/domain/devops-infrastructure.prompt.md"
      description: >
        Domain profile infrastructure: comportamento do Copilot para IaC,
        Kubernetes, Helm, Terraform e hardening de pipelines de infra.
      required: true
      when: null

  patches:
    - file: "Makefile"
      description: >
        Targets de infra: terraform-init, terraform-plan, terraform-apply,
        k8s-apply, helm-upgrade.
      operation: "append"

# ------------------------------------------------------------------
# Compatibilidade entre perfis
# ------------------------------------------------------------------
excludes_with:
  - devops-programming # conflito: estrutura de pastas (src/ vs terraform/)
  - devops-analysis # conflito: convenções de dados vs convenções de infra

combines_with:
  - name: devops-security
    notes: "Transversal — sempre combinado; ativa tfsec + checkov no pipeline"
  - name: k8s-helm
    notes: "[Layer 3] Especialização: Kubernetes workloads com Helm charts"
  - name: terraform-aws
    notes: "[Layer 3] Especialização: provisionamento AWS com Terraform"

# ------------------------------------------------------------------
# Segurança
# ------------------------------------------------------------------
security:
  enforces:
    - "tfsec: infraestrutura sem exposição pública não-intencional"
    - "checkov: controles CKV_AWS_* para recursos Terraform"
    - "Secrets nunca embutidos em manifests YAML/Terraform — usar Vault ou SSM"
    - "RBAC mínimo para service accounts Kubernetes"

# ------------------------------------------------------------------
# Metadados
# ------------------------------------------------------------------
layer: core
tags:
  - infrastructure
  - iac
  - terraform
  - kubernetes
  - docker
  - helm
maintainer: "template-architect"
status: "stub"
notes: >
  Descriptor stub — gerado para resolver referências em excludes_with de outros
  perfis core. Expansão planejada com scope completo de IaC.
