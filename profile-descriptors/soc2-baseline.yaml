schema_version: "1.0.0"

name: soc2-baseline
layer: 4
version: "1.0.0"
last_tested: "2026-03-07"
status: stable

description: >
  Perfil Layer 4 de conformidade com SOC 2 Type II (Trust Services Criteria —
  AICPA). Política de segurança, avaliação de riscos, workflow SAST + SCA
  integrado ao GitHub Actions e Makefile com coleta de evidências por critério
  TSC (CC3, CC6, CC7, CC8). Aplicável sobre qualquer stack — overlay de compliance.

meta:
  maintained_by: "@yves_marinho"
  language: any
  framework: compliance
  tags:
    - soc2
    - security
    - compliance
    - audit
    - trust-services-criteria
    - layer4

compliance:
  standard: "SOC 2 Type II (AICPA Trust Services Criteria)"
  authority: "AICPA — American Institute of Certified Public Accountants"
  key_criteria:
    - "CC3 — Risk Assessment"
    - "CC6 — Logical and Physical Access Controls"
    - "CC7 — System Operations (Monitoring)"
    - "CC8 — Change Management"
    - "A1 — Availability"
    - "C1 — Confidentiality"

combines_with:
  - devops-programming
  - python-fastapi
  - python-flask
  - typescript-next
  - k8s-helm
  - terraform-aws
  - data-warehouse-dbt
  - lgpd-baseline

templates_path: ".github/templates/soc2-baseline"

templates:
  - path: "docs/soc2/SECURITY-POLICY.md"
    description: "Política de segurança (CC6, CC7, CC8) — controles de acesso, MFA, change management, monitoramento, vulnerability management, RTO/RPO e classificação de dados"

  - path: "docs/soc2/RISK-ASSESSMENT.md"
    description: "Registro de riscos (CC3) — metodologia NIST SP 800-30, registro de 8 ameaças com probabilidade/impacto, plano de tratamento e histórico de revisões"

  - path: ".github/workflows/static-analysis.yml"
    description: "Workflow CI/CD SAST + SCA (CodeQL, Bandit, pip-audit, npm audit, Trivy, tfsec) com upload de SARIF para GitHub Security tab e comentário automático em PRs"

  - path: "Makefile.soc2"
    description: "Targets Makefile: soc2-check, soc2-scan-sast, soc2-scan-deps, soc2-scan-iac, soc2-scan-containers, soc2-docs-check, soc2-access-review, soc2-report, soc2-evidence"

security:
  enforces:
    - control: "CC8"
      description: "SBOM (Software Bill of Materials) em formato CycloneDX JSON gerado via 'make sbom' em todos os perfis Layer 2 Python (cyclonedx-bom) e TypeScript (pnpm dlx @cyclonedx/cyclonedx-npm). Evidência de rastreabilidade de componentes para Change Management."
      tool: "cyclonedx-bom / @cyclonedx/cyclonedx-npm"
      severity: "high"
      automated: true
    - control: "CC8"
      description: "Dependências imutáveis em produção: uv sync --frozen (Python) bloqueia versões exatas. Toda mudança de dependência requer PR + revisão."
      tool: "uv"
      severity: "high"
      automated: true
