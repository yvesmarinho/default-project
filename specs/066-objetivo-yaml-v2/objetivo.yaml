## 4️⃣ Restrições e Requisitos Não-Funcionais

### Performance

- **Parse objetivo.yaml**: <100ms (arquivos até 10KB ≈ 350 linhas)
- **Validate**: <50ms
- **Generate objetivo-spec.yaml**: <200ms
- **Total workflow** (parse → validate → generate): <500ms

### Compatibilidade

- **Python**: >=3.11 (stdlib only, zero dependências externas obrigatórias)
- **Plataformas**: Linux, macOS, Windows (CLI cross-platform)
- **Backward compatibility**: Parser detecta v1.0 automaticamente e oferece migração

### Segurança

- **Zero remote calls**: Parser trabalha offline (nenhum LLM, nenhuma API)
- **Validação de entrada**: Sanitize YAML frontmatter para prevenir code injection
- **File permissions**: Não sobrescrever objetivo.yaml sem confirmação explícita

### Acessibilidade

- **Keyboard navigation**: Wizard completo via teclado (sem mouse)
- **Screen reader**: Mensagens formatadas para NVDA/JAWS/VoiceOver
- **Color contrast**: Validador usa ✅ ❌ ⚠️ (não depende apenas de cor)

### Manutenibilidade

- **Zero dependências externas obrigatórias**: PyYAML já presente, Rich opcional
- **Testes**: Cobertura >90% (parser, validator, migrator, wizard)
- **Documentação**: ADRs completos (6 decisões arquiteturais)
- **Versionamento**: Formato versionado (`version: "2.0"` no frontmatter)

