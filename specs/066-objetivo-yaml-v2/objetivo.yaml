## 5️⃣ Regras de Negócio

### Regra #1: Progressive Disclosure (P0 → P1 → P2)

**Cenário**: Usuário cria novo objetivo.yaml

**Níveis de campos**:
1. **P0 (Essencial)**: 3 campos obrigatórios
   - ## 1️⃣ O que este projeto faz?
   - ## 2️⃣ Qual problema resolve?
   - ## 3️⃣ Escopo do Projeto (Incluído/Excluído)
2. **P1 (Contextual)**: 2 campos opcionais revelados após P0
   - ## 4️⃣ Restrições e Requisitos Não-Funcionais
   - ## 5️⃣ Regras de Negócio
3. **P2 (Avançado)**: 4 campos opcionais
   - ## 6️⃣ Estrutura de Pastas
   - ## 7️⃣ Tecnologias e Ferramentas
   - ## 8️⃣ Próximos Passos
   - ## 9️⃣ Contexto Adicional

**Validação**:
- ✅ Validador **DEVE** aceitar objetivo.yaml apenas com P0 preenchido
- ✅ Validador **PODE** avisar (warning) se P1 vazio quando relevante (ex: projeto com compliance)
- ⚠️ Validador **NÃO DEVE** bloquear por P2 vazio (sempre opcional)

---

### Regra #2: Two-File Architecture (Human vs Machine)

**Cenário**: Usuário edita objetivo.yaml e precisa gerar spec

**Arquivos**:
1. **objetivo.yaml** (v2.0) — Input humano, editável
   - Formato: Markdown Híbrido (YAML frontmatter + Markdown body)
   - Owner: Desenvolvedor
   - Versionado no Git: ✅ SIM
2. **objetivo-spec.yaml** — Output máquina, gerado automaticamente
   - Formato: YAML puro técnico
   - Owner: Copilot/SpecKit agents
   - Versionado no Git: ⚠️ OPCIONAL (pode estar em .gitignore)

**Workflow obrigatório**:
```
1. Editar objetivo.yaml
2. Validar: scaffold.py objetivo-validate
3. Gerar spec: scaffold.py objetivo-generate
4. Usar spec: speckit.constitution, speckit.clarify, etc
```

**Regras**:
- ✅ `objetivo-spec.yaml` **DEVE** ter header `# ⚠️ Gerado automaticamente - NÃO editar!`
- ✅ Validador **DEVE** avisar se `objetivo-spec.yaml` mais antigo que `objetivo.yaml`
- ⚠️ Usuário **NÃO DEVE** editar `objetivo-spec.yaml` manualmente (regenerar sempre)

---

### Regra #3: Backward Compatibility v1.0 ↔ v2.0

**Cenário**: Projeto existente usa objetivo.yaml v1.0 (YAML puro)

**Detecção automática**:
- **v1.0**: Arquivo começa com `prompt:` ou `specification:` (sem frontmatter `---`)
- **v2.0**: Arquivo começa com `---` (YAML frontmatter) e tem `version: "2.0"`

**Migração**:
```bash
scaffold.py objetivo-migrate
```

**Regras de migração**:
1. ✅ **Preview obrigatório**: Mostrar side-by-side v1.0 vs v2.0 antes de sobrescrever
2. ✅ **Backup automático**: Criar `objetivo.yaml.v1` antes de sobrescrever
3. ✅ **Mapeamento completo**: 100% campos v1.0 migrados (zero perda)
4. ✅ **Confirmação explícita**: Perguntar "Aceitar? [y/N]" antes de sobrescrever

**Mapeamento de campos v1.0 → v2.0**:

| Campo v1.0 | Campo v2.0 | Transformação |
|------------|------------|---------------|
| `prompt.content.description` | ## 1️⃣ + ## 2️⃣ | Split by sentence: primeira frase → 1️⃣, resto → 2️⃣ |
| `specification.project_name` | `project.name` (frontmatter) | Direto |
| `specification.response` | ## 7️⃣ Tecnologias | Extrair linguagem/framework |
| `rules` → lista | ## 5️⃣ Regras de Negócio | Converter lista YAML → Markdown numerado |
| `out-scope` → string | ## 3️⃣ Escopo (Excluído ❌) | Direto |

---

### Regra #4: Validação com Mensagens Claras

**Cenário**: Usuário comete erro ao preencher objetivo.yaml

**Formato de erro obrigatório**:
```
❌ objetivo.yaml inválido!

Erro #1: Seção P0 obrigatória vazia
   Localização: linha 15-18
   Seção: ## 1️⃣ O que este projeto faz?
   
   ❌ Encontrado:
   15 | ## 1️⃣ O que este projeto faz?
   16 | 
   17 | **Em uma frase**: 
   18 |
   
   ✅ Esperado:
   **Em uma frase**: API REST para gerenciar usuários e autenticação JWT
   
   💡 Dica: Descreva em 1 frase clara o que o projeto faz.
       Exemplo: "Migra dados entre instâncias Chatwoot mantendo integridade referencial"
```

**Regras de mensagens**:
- ✅ **DEVE** mostrar linha exata do erro (não apenas "seção 1 inválida")
- ✅ **DEVE** mostrar diff colorido (❌ Encontrado vs ✅ Esperado)
- ✅ **DEVE** sugerir exemplo de correção específico para aquela seção
- ✅ **PODE** sugerir instalar Rich para output colorido (se não disponível)
- ⚠️ **NÃO DEVE** apenas dizer "campo obrigatório vazio" (genérico demais)

---

### Regra #5: Wizard Accessibility (Keyboard-Only)

**Cenário**: Usuário iniciante usa wizard interativo

**Keyboard shortcuts obrigatórios**:
- **Enter**: Confirmar resposta atual
- **Enter Enter** (duplo): Terminar input multiline (lista de itens)
- **Ctrl+C**: Cancelar wizard → salvar draft em `objetivo-draft.yaml`
- **Ctrl+Z**: Voltar para pergunta anterior (undo)
- **Tab**: Auto-complete exemplo (se Rich disponível) — OPCIONAL

**Regras**:
- ✅ Wizard **DEVE** funcionar sem mouse (keyboard-only)
- ✅ Wizard **DEVE** funcionar sem Rich (fallback print() simples)
- ✅ Wizard **DEVE** permitir pular perguntas P1/P2 (Enter vazio)
- ⚠️ Wizard **NÃO DEVE** bloquear se usuário pressionar Ctrl+C (salvar draft e sair)

