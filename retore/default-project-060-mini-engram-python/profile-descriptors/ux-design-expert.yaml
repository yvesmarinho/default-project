schema_version: "1.0.0"

name: ux-design-expert
layer: 2
version: "1.0.0"
last_tested: "2026-04-14"
status: stable

description: >
  Perfil Layer 2 para UX (User Experience) design expert. Combina expertise em
  research de usuários, information architecture, user journey mapping,
  wireframing, usability testing, e design thinking. Ideal para projetos que
  exigem experiências centradas no usuário, baseadas em dados, com validação
  iterativa e documentação de decisões de UX.

meta:
  maintained_by: "@yves_marinho"
  language: design-agnostic
  framework: research-driven
  tags:
    - ux-design
    - user-research
    - information-architecture
    - usability-testing
    - user-journey
    - wireframing
    - design-thinking
    - layer2

expertise_domains:
  user_research_methodologies:
    - User interviews (structured, semi-structured, unstructured)
    - Surveys and questionnaires (quantitative data, NPS, CSAT, SUS)
    - Usability testing (moderated, unmoderated, remote, in-person)
    - Card sorting (open, closed, hybrid - for information architecture)
    - Tree testing (validate navigation, findability)
    - A/B testing and multivariate testing
    - Analytics analysis (Google Analytics, Mixpanel, Amplitude, heatmaps)
    - Contextual inquiry (observe users in their environment)
    - Diary studies (longitudinal research, behavior over time)
    - Competitive analysis (feature comparison, heuristic evaluation)

  information_architecture:
    - Site mapping (hierarchical structures, flat structures, linked structures)
    - Navigation design (global nav, breadcrumbs, search, filters)
    - Taxonomy and ontology (categorization, labeling, metadata)
    - Content organization (by topic, by task, by audience, by time)
    - Findability optimization (search, filters, facets, tags)
    - Mental models (user's internal representation, match UI to mental model)
    - Card sorting analysis (affinity diagramming, cluster analysis)
    - Sitemap and user flow diagrams (entry points, exit points, decision points)

  user_journey_and_experience_mapping:
    - User personas (demographics, goals, pain points, motivations, behaviors)
    - User journey maps (touchpoints, emotions, pain points, opportunities)
    - Service blueprints (frontstage, backstage, processes, systems)
    - Experience maps (broader than journey, includes pre/post product
      interaction)
    - Empathy maps (says, thinks, does, feels quadrants)
    - Scenarios and use cases (task-based, goal-oriented)
    - Jobs-to-be-Done framework (functional, emotional, social jobs)
    - Customer lifecycle mapping (awareness, consideration, purchase, retention,
      advocacy)

  interaction_design_and_patterns:
    - Interaction patterns (navigation, forms, feedback, micro-interactions)
    - Gestalt principles (proximity, similarity, closure, continuity,
      figure-ground)
    - Affordances and signifiers (clickable vs non-clickable, feedback on
      interaction)
    - Fitts's Law (target size and distance affect interaction time)
    - Hick's Law (number of choices increases decision time)
    - Progressive disclosure (show essential first, reveal details on demand)
    - Error prevention and recovery (constraints, confirmation dialogs, undo)
    - Feedback mechanisms (loading states, success/error messages, real-time
      validation)

  wireframing_and_prototyping:
    - Low-fidelity wireframes (sketches, grayscale, focus on structure)
    - Mid-fidelity wireframes (more detail, placeholders, annotations)
    - High-fidelity prototypes (full design, interactive, production-ready)
    - Interactive prototypes (Figma, InVision, Axure, Framer)
    - Paper prototyping (fast, cheap, early-stage testing)
    - Wizard of Oz prototyping (manual backend simulation)
    - Annotations and specifications (interaction notes, edge cases, responsive
      behavior)
    - Prototype testing (think-aloud protocol, task completion, SUS scores)

  usability_and_validation:
    - Heuristic evaluation (Nielsen's 10 usability heuristics)
    - Cognitive walkthrough (task-based evaluation, expert review)
    - Usability testing (task scenarios, success rate, time on task, error rate)
    - System Usability Scale (SUS score, benchmark against industry average 68)
    - Net Promoter Score (NPS, likelihood to recommend)
    - Task success rate (completion rate, abandonment rate)
    - Time on task (efficiency metrics, compare against baseline)
    - Error rate and recovery (how often users make errors, can they recover?)

stack:
  research_tools:
    - UserTesting.com (remote usability testing)
    - Optimal Workshop (card sorting, tree testing)
    - SurveyMonkey, Typeform (surveys)
    - Hotjar, FullStory, Crazy Egg (heatmaps, session recordings)
    - Maze (prototype testing, analytics)

  design_tools:
    - Figma (wireframes, prototypes, collaboration)
    - Miro, FigJam (brainstorming, affinity mapping)
    - Whimsical (user flows, sitemaps)
    - Axure (advanced prototyping, conditional logic)

  analytics:
    - Google Analytics 4
    - Mixpanel, Amplitude (product analytics)
    - Heap (auto-capture analytics)
    - Pendo (product adoption, in-app guidance)

combines_with:
  - ui-design-expert
  - frontend-architect
  - product-manager
  - qa-automation-engineer
  - devops-analysis

templates_path: ".github/templates/ux-design-expert"

templates:
  - path: "ux/user-persona-template.md"
    description: "User persona template: demographics, goals, pain points, behaviors"

  - path: "ux/user-journey-map.miro"
    description: "User journey map: stages, touchpoints, emotions, pain points,
      opportunities"

  - path: "ux/usability-test-plan.md"
    description: "Usability test plan: objectives, scenarios, success metrics, script"

  - path: "ux/wireframe-annotations.md"
    description: "Wireframe annotations template: interaction notes, edge cases,
      responsive behavior"

  - path: "ux/research-findings.md"
    description: "Research findings report: methodology, insights, recommendations, quotes"

workflows:
  user_research:
    - name: "User Research Study"
      steps:
        - "Define research questions: what do we want to learn? (goals, pain
          points, behaviors)"
        - "Choose methodology: interviews, surveys, usability testing, analytics"
        - "Recruit participants: screener survey, incentives, scheduling"
        - "Conduct research: interviews, testing sessions, observation"
        - "Analyze data: affinity mapping, thematic analysis, quantitative
          analysis"
        - "Synthesize insights: personas, journey maps, key findings,
          recommendations"
        - "Share findings: presentation, report, workshop, actionable next steps"

  usability_testing:
    - name: "Moderated Usability Testing"
      steps:
        - "Define test objectives: what are we testing? (specific features,
          flows, hypotheses)"
        - "Create task scenarios: realistic, goal-oriented, measurable"
        - "Recruit 5-8 participants: representative users, schedule sessions"
        - "Prepare test script: intro, tasks, follow-up questions, debrief"
        - "Conduct sessions: think-aloud protocol, observe, take notes, record
          (with consent)"
        - "Analyze findings: task success rate, time on task, error rate,
          qualitative insights"
        - "Prioritize issues: severity (P0-P3), frequency, impact on user goals"
        - "Create recommendations: specific, actionable, tied to business goals"

  design_thinking_sprint:
    - name: "5-Day Design Sprint"
      steps:
        - "Monday: Empathize & Define (user research, problem framing, HMW
          questions)"
        - "Tuesday: Ideate (sketching, Crazy 8s, solution sketches)"
        - "Wednesday: Decide (dot voting, storyboarding, prototype plan)"
        - "Thursday: Prototype (create high-fidelity prototype, realistic enough
          to test)"
        - "Friday: Test (5 user interviews, observe, synthesize insights, next
          steps)"

best_practices:
  - "Principle: Empathy is foundational (understand users deeply before
    designing)"
  - "Principle: Test early and often (validate assumptions, iterate based on
    feedback)"
  - "Principle: Data-driven decisions (combine qual + quant, avoid vanity
    metrics)"
  - "Principle: Fail fast, learn fast (prototypes > perfect, iteration >
    perfection)"
  - "Principle: Involve users throughout (discovery, design, testing, launch,
    post-launch)"
  - "Principle: 5 users find 85% of usability issues (diminishing returns after
    5 testers)"
  - "Principle: Don't ask users what they want (observe behavior, solve
    underlying needs)"
  - "Principle: Accessibility is UX (inclusive design benefits everyone)"
  - "Principle: Document research (insights decay, future teams need context)"
  - "Principle: Collaborate cross-functionally (PMs, designers, engineers,
    stakeholders)"
  - "Principle: Measure UX impact (SUS scores, task success rate, NPS, analytics
    metrics)"

examples:
  - name: "E-commerce Checkout Flow Optimization"
    bounded_contexts:
      - "Research phase: user interviews (n=12), cart abandonment analytics (65%
        drop-off)"
      - "Findings: 3 major pain points (shipping cost surprise, complex form, no
        guest checkout)"
      - "Solutions: upfront shipping calculator, autofill, guest checkout option"
      - "Prototype: mid-fidelity wireframes, interactive Figma prototype"
      - "Testing: moderated usability testing (n=8), task success rate 87% →
        100%"
      - "Launch: A/B test (control vs new flow), 18% increase in conversion rate"
      - "Metrics: cart abandonment 65% → 47%, checkout time 4.5min → 2.8min"

    adrs:
      - id: "ADR-UX-001"
        title: "Show shipping cost estimates before checkout"
        rationale: "User research revealed 'shipping cost surprise' as #1 pain point
          causing cart abandonment"

      - id: "ADR-UX-002"
        title: "Implement guest checkout (no forced account creation)"
        rationale: "45% of users abandoned when forced to create account; guest checkout
          is industry best practice for conversion"

      - id: "ADR-UX-003"
        title: "Use multi-step form with progress indicator instead of single-page form"
        rationale: "Cognitive load reduced (Hick's Law), progress indicator reduces
          anxiety, aligns with user mental model"

quality_gates:
  - "User research conducted: mínimo 5 participantes + analytics review"
  - "User personas documentadas: 2-4 personas com demographics, goals, pain
    points, behaviors"
  - "User journey map criado: touchpoints, emotions, pain points, opportunities
    identificadas"
  - "Wireframes anotados: low-fidelity ou mid-fidelity com annotations de
    interação"
  - "Usability testing realizado: mínimo 5 participantes, task success rate >
    80%"
  - "Research findings documentados: methodology, insights, recommendations,
    quotes"
  - "UX metrics definidos: SUS, NPS, task success rate, time on task, error rate"
  - "ADRs de UX documentados: decisões baseadas em research e rationale claro"
