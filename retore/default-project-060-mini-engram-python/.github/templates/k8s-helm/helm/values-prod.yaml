# ============================================================
# values-prod.yaml — Overrides para ambiente produção.
# Uso: helm upgrade --install myapp helm/ -f helm/values.yaml -f helm/values-prod.yaml
# ============================================================

# At least 2 replicas for high availability (HPA controls upper bound)
replicaCount: 2

image:
  # Never use Always in prod — avoids registry dependency on restart
  pullPolicy: IfNotPresent

# Higher resources for production workload
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# HPA enabled in production for cost-efficiency under variable load
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  hosts:
    - host: my-app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: my-app-prod-tls
      hosts:
        - my-app.example.com
