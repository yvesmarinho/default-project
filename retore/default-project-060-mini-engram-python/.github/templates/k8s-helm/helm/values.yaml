# ============================================================
# values.yaml — Default values for my-app chart.
# Override per-environment via values-staging.yaml / values-prod.yaml
# IMPORTANT: Never put secrets here — use ExternalSecrets or sealed-secrets.
# ============================================================

# Number of replicas (ignored when autoscaling.enabled=true)
replicaCount: 1

image:
  # Container image repository (without tag)
  repository: my-app
  # Pull policy: IfNotPresent (stable tag), Always (dev), Never (local only)
  pullPolicy: IfNotPresent
  # Overrides Chart.AppVersion when set
  tag: ""

# Secrets for pulling images from private registries
imagePullSecrets: []
# - name: regcred

# Override chart name (default: Chart.Name)
nameOverride: ""
# Override fully qualified app name
fullnameOverride: ""

serviceAccount:
  # Create a ServiceAccount for this release
  create: true
  # Do NOT automount the K8s API token — principle of least privilege
  automount: false
  # Annotations for IRSA (AWS EKS) or Workload Identity (GKE)
  annotations: {}
  # Explicit name (default: release fullname)
  name: ""

podAnnotations: {}
podLabels: {}

# Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

# Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  # Port the container listens on (update to match your app)
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: my-app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: my-app-tls
      hosts:
        - my-app.example.com

# Container resource requests/limits — required for scheduler and HPA
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Liveness probe — K8s restarts pod if this fails
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe — K8s stops sending traffic if this fails
readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Non-sensitive environment variables injected via ConfigMap.
# For SENSITIVE values use ExternalSecrets / sealed-secrets.
env: {}
# ENV: value
# DATABASE_URL: NOT_HERE_USE_EXTERNALSECRETS

nodeSelector: {}
tolerations: []
affinity: {}
