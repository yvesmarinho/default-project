[pytest]
# Test Discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and Reporting
addopts =
    --verbose
    --strict-markers
    --tb=short
    --color=yes
    --maxfail=5
    --durations=10

# Note: Coverage flags moved to Makefile `make test` target
# This allows running quick tests without coverage: `make test-quick`
# For coverage reports: `make test` or `make test-cov`

# Markers
markers =
    unit: Unit tests (isolated, fast)
    integration: Integration tests (requires external services)
    slow: Slow tests (> 1 second)
    smoke: Smoke tests (quick validation)
    security: Security-related tests
    skip_ci: Skip in CI/CD pipeline
    requires_docker: Requires Docker daemon
    requires_ssh: Requires SSH server
    requires_network: Requires network connectivity

# Coverage Options
[coverage:run]
source = src,scripts/lib
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */site-packages/*
    */venv/*
    */.venv/*
branch = True
parallel = True

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    raise AssertionError
    raise NotImplementedError
    except ImportError
    if 0:
    if False:

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
