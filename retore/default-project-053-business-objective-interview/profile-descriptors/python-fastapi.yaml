# ============================================================
# Profile Descriptor — python-fastapi
# Layer 2 — sobre devops-programming (language: python)
# Schema versão 1.0.0
# ============================================================

name: python-fastapi
description: >
  Layer 2 para projetos Python FastAPI. Gera estrutura src/api/v1/, app factory
  com lifespan, pydantic-settings, pytest-asyncio, Dockerfile multistage com
  uv sync --frozen e Makefile com targets dev/test/lint/audit/security.

VERSION: "1.0.0"
LAST_TESTED_DATE: "2026-03-07"

requires:
  - "python >= 3.11"
  - "uv installed"
  - "language == python"
  - "domain == programming"
  - "docker installed" # opcional — para docker-build/docker-up

generates:
  files:
    - path: "src/main.py"
      source: ".github/templates/python-fastapi/src/main.py"
      description: "FastAPI app factory com lifespan e include_router"
      required: true
      when: null

    - path: "src/api/__init__.py"
      source: "inline (vazio)"
      description: "Pacote api"
      required: true
      when: null

    - path: "src/api/router.py"
      source: ".github/templates/python-fastapi/src/api/router.py"
      description: "APIRouter principal que agrega sub-routers"
      required: true
      when: null

    - path: "src/api/v1/__init__.py"
      source: "inline (vazio)"
      description: "Pacote v1"
      required: true
      when: null

    - path: "src/api/v1/health.py"
      source: ".github/templates/python-fastapi/src/api/v1/health.py"
      description: "GET /api/health — smoke endpoint"
      required: true
      when: null

    - path: "src/core/__init__.py"
      source: "inline (vazio)"
      description: "Pacote core"
      required: true
      when: null

    - path: "src/core/config.py"
      source: ".github/templates/python-fastapi/src/core/config.py"
      description: "pydantic-settings: PROJECT_NAME, ENV, SECRET_KEY, DATABASE_URL"
      required: true
      when: null

    - path: "tests/conftest.py"
      source: ".github/templates/python-fastapi/tests/conftest.py"
      description: "Fixture AsyncClient via ASGITransport para testes HTTP em memória"
      required: true
      when: null

    - path: "tests/test_health.py"
      source: ".github/templates/python-fastapi/tests/test_health.py"
      description: "Smoke test do endpoint /api/health"
      required: true
      when: null

    - path: "pyproject.toml"
      source: ".github/templates/python-fastapi/pyproject.toml"
      description: "PEP 621: fastapi, uvicorn, pydantic-settings, pytest-asyncio, ruff, bandit, pip-audit"
      required: true
      when: null

    - path: ".env.example"
      source: ".github/templates/python-fastapi/.env.example"
      description: "Variáveis de ambiente documentadas sem valores reais"
      required: true
      when: null

    - path: "Dockerfile"
      source: ".github/templates/python-fastapi/Dockerfile"
      description: "Multistage: builder (uv sync --frozen --no-dev) + runtime (usuário não-root)"
      required: true
      when: null

    - path: "docker-compose.yml"
      source: ".github/templates/python-fastapi/docker-compose.yml"
      description: "Serviços: app + postgres:16 com healthcheck"
      required: true
      when: null

    - path: "Makefile"
      source: ".github/templates/python-fastapi/Makefile"
      description: "Targets: install, dev, test, lint, format, audit, security, sbom, docker-*, ci, clean"
      required: true
      when: null

    - path: "sbom.json"
      source: "generated by 'make sbom' (cyclonedx-bom)"
      description: "Software Bill of Materials em CycloneDX JSON — evidência CC8 SOC 2 Change Management"
      required: false
      when: "make sbom"

    - path: ".github/prompts/domain/layer2-python-fastapi.prompt.md"
      source: ".github/prompts/domain/layer2-python-fastapi.prompt.md"
      description: "Domain profile: convenções FastAPI, padrões de teste, segurança"
      required: true
      when: null

  patches:
    - file: ".gitignore"
      description: "Adiciona .env, .venv/, __pycache__/, htmlcov/, .coverage"
      operation: "append"

    - file: "docs/TODO.md"
      description: "Adiciona checklist de primeiro deploy FastAPI (SECRET_KEY, CORS, rate limiting)"
      operation: "append"

excludes_with:
  - python-flask # dois frameworks Python no mesmo projeto é conflito
  - devops-infrastructure
  - devops-analysis

combines_with:
  - name: devops-programming
    notes: "Obrigatório — este perfil é Layer 2 sobre devops-programming"
  - name: devops-security
    notes: "Sempre combinado — transversal"

security:
  enforces:
    - control: "CWE-312"
      description: "SECRET_KEY via pydantic-settings + .env (nunca hardcoded)"
      tool: "manual"
      severity: "critical"
      automated: false
    - control: "OWASP-A05"
      description: "CORSMiddleware com allow_origins explícito (nunca ['*'] em produção)"
      tool: "manual"
      severity: "high"
      automated: false
    - control: "OWASP-A06"
      description: "bandit -r src/ disponível via 'make security'"
      tool: "bandit"
      severity: "high"
      automated: true
    - control: "OWASP-A06"
      description: "pip-audit disponível via 'make audit'"
      tool: "pip-audit"
      severity: "high"
      automated: true
    - control: "OWASP-A01"
      description: "Dockerfile executa como usuário não-root (adduser app)"
      tool: "docker"
      severity: "high"
      automated: false
    - control: "OWASP-A06"
      description: "uv sync --frozen --no-dev na imagem de produção (sem deps dev)"
      tool: "uv"
      severity: "medium"
      automated: true
    - control: "OWASP-A05"
      description: "Swagger/ReDoc desabilitado quando ENV=production"
      tool: "manual"
      severity: "medium"
      automated: false
    - control: "CWE-312"
      description: "POSTGRES_PASSWORD via variável de ambiente obrigatória no docker-compose"
      tool: "manual"
      severity: "critical"
      automated: false
    - control: "CC8"
      description: "SBOM (CycloneDX JSON) gerado via 'make sbom' (uv run cyclonedx-bom) — rastreabilidade de componentes para Change Management"
      tool: "cyclonedx-bom"
      severity: "high"
      automated: true

ci_targets:
  - lint
  - format-check
  - security-full
  - test
  - sbom

tags:
  - python
  - fastapi
  - async
  - api
  - layer2
  - uv
  - docker

layer: layer2
maintainer: "template-architect"
