name: Static Analysis & Dependency Audit — SOC 2 Baseline

# Análise estática de segurança (SAST) + auditoria de dependências (SCA).
# SOC 2 CC7.1 — Identificação e gerenciamento de vulnerabilidades.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Varredura diária — detecta CVEs publicados em dependências existentes
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # upload SARIF para GitHub Security tab
  pull-requests: write # comentários em PRs (opcional)

jobs:
  # --------------------------------------------------------------------------
  # SAST — Static Application Security Testing
  # --------------------------------------------------------------------------
  sast:
    name: SAST — Análise Estática de Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CodeQL — suportado nativamente pelo GitHub (Python, JS/TS, Go, Java, C#)
      - name: CodeQL — Inicializar
        uses: github/codeql-action/init@v3
        with:
          languages: python # Adicione: javascript, typescript, go, java, csharp
          queries: security-and-quality

      - name: CodeQL — Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: CodeQL — Analisar e subir SARIF
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

      # Bandit — SAST específico para Python
      - name: Bandit — Scan Python (SAST)
        if: hashFiles('**/*.py') != ''
        run: |
          pip install bandit[toml] --quiet
          bandit -r src/ -ll -f sarif -o bandit-results.sarif 2>/dev/null || true
          bandit -r src/ -ll -q 2>&1 | tail -20
        continue-on-error: true

      - name: Upload Bandit SARIF
        if: hashFiles('bandit-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  # --------------------------------------------------------------------------
  # SCA — Software Composition Analysis (dependências)
  # --------------------------------------------------------------------------
  dependency-audit:
    name: SCA — Auditoria de Dependências
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python — pip-audit
      - name: Python — pip-audit (CVEs em dependências)
        if: hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/uv.lock') != ''
        run: |
          pip install pip-audit uv --quiet

          echo "=== Auditando dependências Python ==="
          if [ -f "uv.lock" ] || [ -f "pyproject.toml" ]; then
            uv export --no-editable 2>/dev/null | pip-audit --stdin \
              --output-format columns \
              --ignore-vuln PYSEC-2022-42969 \
              2>&1 || echo "⚠️ Vulnerabilidades encontradas — revisar acima"
          elif [ -f "requirements.txt" ]; then
            pip-audit -r requirements.txt --output-format columns 2>&1 || \
              echo "⚠️ Vulnerabilidades encontradas — revisar acima"
          fi

      # Node.js — npm audit
      - name: Node.js — npm audit
        if: hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') != ''
        run: |
          echo "=== Auditando dependências Node.js ==="
          npm audit --audit-level=high --output-format json 2>&1 | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          vulns = data.get('vulnerabilities', {})
          critical = sum(1 for v in vulns.values() if v.get('severity') == 'critical')
          high = sum(1 for v in vulns.values() if v.get('severity') == 'high')
          print(f'Critical: {critical}, High: {high}')
          if critical > 0:
              sys.exit(1)
          " || echo "❌ Vulnerabilidades CRITICAL em dependências Node.js"

      # Trivy — scan de containers e filesystem
      - name: Trivy — Container & Filesystem Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
        continue-on-error: true

  # --------------------------------------------------------------------------
  # Infrastructure Security — Terraform/IaC scanning
  # --------------------------------------------------------------------------
  iac-scan:
    name: IaC — Terraform Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: hashFiles('**/*.tf') != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: tfsec — Terraform Security Scanner
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true # Mude para false em produção quando todos os issues forem resolvidos

      - name: checkov — Misconfigurations em IaC
        uses: bridgecrewio/checkov-action@v12.3088.0
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov
        continue-on-error: true

  # --------------------------------------------------------------------------
  # Sumário (comentário em PR)
  # --------------------------------------------------------------------------
  security-summary:
    name: Sumário de Segurança
    runs-on: ubuntu-latest
    needs: [sast, dependency-audit]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Comentar resultado no PR
        uses: actions/github-script@v7
        with:
          script: |
            const sast = '${{ needs.sast.result }}';
            const deps = '${{ needs.dependency-audit.result }}';
            const statusIcon = (r) => r === 'success' ? '✅' : r === 'failure' ? '❌' : '⚠️';
            const body = `## 🔒 Security Analysis Summary

            | Check | Status |
            |-------|--------|
            | SAST (CodeQL + Bandit) | ${statusIcon(sast)} ${sast} |
            | Dependency Audit (pip-audit + npm audit + Trivy) | ${statusIcon(deps)} ${deps} |

            > View details in the [Security tab](/${{ github.repository }}/security).
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
