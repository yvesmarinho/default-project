name: "{{project_name}}"
version: "1.0.0"
config-version: 2
profile: "{{project_name}}"

# Directory structure
model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model materialisation defaults per layer
models:
  "{{project_name}}":
    # Staging: views — cheap, always up-to-date
    staging:
      +materialized: view
      +schema: staging
      +tags:
        - staging

    # Intermediate: views — transformations before business logic
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags:
        - intermediate

    # Marts: tables — optimised for BI tools and end users
    marts:
      +materialized: table
      +schema: marts
      +tags:
        - marts

# Variables (override per environment in profiles.yml)
vars:
  start_date: "2024-01-01"
