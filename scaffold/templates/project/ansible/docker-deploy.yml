---
# Docker Compose Stack Deployment
#
# This playbook deploys a Docker Compose stack with:
# - Project directory setup
# - Environment file templating
# - Compose file deployment
# - Health checks
# - Rollback on failure
#
# Usage:
#   ansible-playbook docker-deploy.yml
#
# Required Variables:
#   - compose_project_name: Name of the Docker Compose project
#
# Optional Variables:
#   - compose_pull_images: Pull latest images before deploy (default: true)
#   - compose_recreate: Force recreate containers (default: false)

- name: Deploy Docker Compose Stack
  hosts: docker_hosts
  become: true
  gather_facts: true

  vars:
    # Project configuration
    compose_project_name: "myapp"
    compose_project_dir: "/opt/{{ compose_project_name }}"
    compose_user: "docker"
    compose_group: "docker"

    # Compose files to deploy
    compose_files:
      - docker-compose.yml
      - docker-compose.override.yml

    # Deployment options
    compose_pull_images: true
    compose_recreate: false
    compose_remove_orphans: true

    # Health check services (service_name: port)
    health_check_services:
      web: 80
      api: 8080
      db: 5432

    health_check_timeout: 60

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - compose_project_name is defined
          - compose_project_name != ""
        fail_msg: "compose_project_name must be defined"

    - name: Verify Docker is installed and running
      ansible.builtin.systemd:
        name: docker
        state: started
      check_mode: true
      register: docker_check
      failed_when: docker_check.status.ActiveState != "active"

  tasks:
    - name: Docker Compose deployment
      block:
        - name: Create project directory
          ansible.builtin.file:
            path: "{{ compose_project_dir }}"
            state: directory
            owner: "{{ compose_user }}"
            group: "{{ compose_group }}"
            mode: "0755"

        - name: Create subdirectories
          ansible.builtin.file:
            path: "{{ compose_project_dir }}/{{ item }}"
            state: directory
            owner: "{{ compose_user }}"
            group: "{{ compose_group }}"
            mode: "0755"
          loop:
            - config
            - data
            - logs

        - name: Copy docker-compose files
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "{{ compose_project_dir }}/{{ item }}"
            owner: "{{ compose_user }}"
            group: "{{ compose_group }}"
            mode: "0644"
          loop: "{{ compose_files }}"
          register: compose_files_copied

        - name: Template environment file
          ansible.builtin.template:
            src: .env.j2
            dest: "{{ compose_project_dir }}/.env"
            owner: "{{ compose_user }}"
            group: "{{ compose_group }}"
            mode: "0600"
          register: env_file
          no_log: true # Prevent exposing secrets

        - name: Backup current state
          ansible.builtin.command: >
            docker compose
            -f {{ compose_project_dir }}/docker-compose.yml
            -p {{ compose_project_name }}
            ps --format json
          register: current_state
          changed_when: false
          failed_when: false

        - name: Pull latest images
          ansible.builtin.command: >
            docker compose
            -f {{ compose_project_dir }}/docker-compose.yml
            -p {{ compose_project_name }}
            pull
          when: compose_pull_images
          register: pull_result

        - name: Deploy Docker Compose stack
          ansible.builtin.command: >
            docker compose
            -f {{ compose_project_dir }}/docker-compose.yml
            -p {{ compose_project_name }}
            up -d
            {{ '--force-recreate' if compose_recreate else '' }}
            {{ '--remove-orphans' if compose_remove_orphans else '' }}
          register: deploy_result
          environment:
            COMPOSE_PROJECT_NAME: "{{ compose_project_name }}"

        - name: Wait for services to start
          ansible.builtin.pause:
            seconds: 10

        - name: Check service health - verify ports
          ansible.builtin.wait_for:
            host: localhost
            port: "{{ item.value }}"
            state: started
            delay: 2
            timeout: "{{ health_check_timeout }}"
          loop: "{{ health_check_services | dict2items }}"
          when: health_check_services is defined

        - name: Get container status
          ansible.builtin.command: >
            docker compose
            -f {{ compose_project_dir }}/docker-compose.yml
            -p {{ compose_project_name }}
            ps --format json
          register: final_state
          changed_when: false

        - name: Verify all containers are running
          ansible.builtin.shell: |
            docker compose -f {{ compose_project_dir }}/docker-compose.yml -p {{ compose_project_name }} ps --format json | \
            jq -r '.[] | select(.State != "running") | .Name'
          register: stopped_containers
          changed_when: false
          failed_when: stopped_containers.stdout != ""

        - name: Display deployment summary
          ansible.builtin.debug:
            msg:
              - "✅ Docker Compose stack deployed successfully"
              - "Project: {{ compose_project_name }}"
              - "Location: {{ compose_project_dir }}"
              - "Services: {{ (final_state.stdout | from_json) | length }}"

      rescue:
        - name: Deployment failed - attempting rollback
          ansible.builtin.debug:
            msg: "❌ Deployment failed, rolling back..."

        - name: Stop failed deployment
          ansible.builtin.command: >
            docker compose
            -f {{ compose_project_dir }}/docker-compose.yml
            -p {{ compose_project_name }}
            down
          ignore_errors: true

        - name: Restore previous environment file
          ansible.builtin.copy:
            src: "{{ compose_project_dir }}/.env.backup"
            dest: "{{ compose_project_dir }}/.env"
            remote_src: true
          when: env_file.backup_file is defined
          ignore_errors: true

        - name: Attempt to restart previous state
          ansible.builtin.command: >
            docker compose
            -f {{ compose_project_dir }}/docker-compose.yml
            -p {{ compose_project_name }}
            up -d
          ignore_errors: true

        - name: Fail deployment
          ansible.builtin.fail:
            msg: "Docker Compose deployment failed and rollback attempted"

  post_tasks:
    - name: Show container logs (last 20 lines)
      ansible.builtin.command: >
        docker compose
        -f {{ compose_project_dir }}/docker-compose.yml
        -p {{ compose_project_name }}
        logs --tail=20
      register: container_logs
      changed_when: false

    - name: Display container logs
      ansible.builtin.debug:
        var: container_logs.stdout_lines
      when: ansible_verbosity >= 1
