# _meta:
#   criado_em: "26/06/2026 15:30"
#   modificado_em: "26/06/2026 15:30"
#
# Template minimal enriquecido para objetivo-init.
# Baseado no template base (objetivo-init-template.yaml) com adição das seções:
#   regras_projeto, regras_gerais, ai_safety_instructions, infrastructure,
#   profile (detalhado), expected_outcome (com success_criteria/quality_gates).
#
# Placeholders: {{PLACEHOLDER}} — substituir antes de usar.
# Campos com valor padrão: manter ou ajustar conforme o projeto.

prompt:
  role: user
  content:
    description: "{{DESCRIPTION}}"
    specification:
      project_name: "{{PROJECT_NAME}}"
      created_at: "{{CREATED_AT}}"
      modify_at: "{{CREATED_AT}}"
      owner: "{{OWNER}}"
      description: "{{PROJECT_DESCRIPTION_SHORT}}"
      output_format: "{{OUTPUT_FORMAT}}"
      docstring_style: "{{DOCSTRING_STYLE}}"
      primary_workflow: "{{PRIMARY_WORKFLOW}}"
      planning_workflow: "objetivo.yaml → architecture debate → project constitution → specification → plan → tasks → implementation"
      scope_boundary: "Out-of-scope items documented separately in docs/out-of-scope.md"
      objetivos:
        - "{{OBJETIVO_1}}"
        - "{{OBJETIVO_2}}"
        - "{{OBJETIVO_3}}"
      architecture:
        statement: >
          Adotar arquitetura em camadas com Application, Domain e Infrastructure,
          seguindo DDD leve, SOLID, validação de contratos, testes automatizados
          e observabilidade por logs estruturados.
        style: "Arquitetura Hexagonal simplificada ou Camadas + Casos de Uso"
        layers:
          - "Application — casos de uso, orquestração, DTOs"
          - "Domain — entidades, regras de negócio, contratos, value objects"
          - "Infrastructure — I/O, banco, integrações externas, adapters"
        principles:
          - "DDD leve — apenas para modelar domínio e linguagem ubíqua"
          - "SOLID como critério de revisão, não como obsessão"
          - "TDD para partes críticas do domínio"
          - "GoF apenas quando houver problema real que justifique"
          - "Contratos de entrada/saída com schemas e validação explícita"
          - "Logs estruturados para observabilidade"
          - "Configuração por arquivos e variáveis de ambiente"
        mandatory_requirements:
          - "Testes unitários + integração + CLI"
          - "Lint, typing e coverage obrigatórios no CI"
          - "Toda entrada validada antes de chegar ao domínio"
          - "Integrações externas encapsuladas na camada Infrastructure"
          - "Camada Domain sem dependência de framework, CLI ou SDK externo"
      regras_projeto:
        - "✅ {{REGRA_PROJETO_1}}"
        - "✅ {{REGRA_PROJETO_2}}"
        - "✅ {{REGRA_PROJETO_3}}"
        - "✅ Use Python (3.10+) como linguagem principal de automação; shell apenas para orquestração simples"
        - "✅ Use `uv` como gerenciador de ambiente Python"
        - "✅ Toda requisição de API deve usar Python (biblioteca requests); nunca usar curl para validação"
        - "✅ Gerenciamento de configuração: todos os segredos/credenciais em .secrets/ (não versionado e não mencionado no chat)"
        - "✅ Qualidade de código obrigatória: PEP 8, formatação black, type hints (mypy), linting (ruff), testes (pytest)"
        - "✅ Manter projeto limpo: sem arquivos redundantes; .gitignore claro; versionar apenas artefatos essenciais"
      regras_gerais:
        - "📁 Organização de arquivos: fonte em src/, scripts em scripts/, testes em tests/, docs em docs/ (sem arquivos de projeto na raiz, exceto configurações essenciais)"
        - "🔐 Segurança: usar .secrets/ para todas as credenciais; arquivos .env nunca commitados; bandit + safety checks em CI/pre-commit"
        - "📝 Documentação: todo bloco de código deve ter docstrings; ADRs para decisões arquiteturais; READMEs para cada módulo principal"
        - "📦 Controle de versão: commits atômicos com mensagens detalhadas; branches de feature seguem convenção de nomenclatura; sem commits sem testes passando"
        - "🔄 Gerenciamento de branches: SEMPRE fazer merge da branch de feature de volta ao master após conclusão do objetivo; limpar branches mescladas"
        - "✅ Quality gates: hooks pre-commit aplicam black, ruff, mypy; pytest deve passar antes do merge; verificação de segurança em PRs"
        - "📋 Validação de configuração: yamllint para todos os arquivos YAML; check-jsonschema para validação de JSON"
        - "🧪 Estratégia de testes: pytest para testes unitários/integração; nunca curl manual (sempre Python requests)"
        - "🚀 Prontidão para deploy: scripts devem ser idempotentes; configuração do ambiente reproduzível do zero; tratamento de erros abrangente"
        - "🐛 Rastreamento de bugs: todo erro/problema deve gerar bug-report em docs/bugs/ com timestamp, stack trace, passos de reprodução e workaround"
        - "📊 Rastreamento de sessão: todo trabalho registrado em docs/SESSIONS/YYYY-MM-DD/ com timestamps, decisões e resultados"

    folder_structure:
      - ".github: Agents, Workflows e ações para CI/CD (gerados automaticamente)"
      - ".git-hooks: Hooks personalizados para Git (gerados automaticamente)"
      - ".memory: Memória e contexto de agentes"
      - ".secrets: Armazenamento seguro de chaves e tokens (não versionado)"
      - ".specify: Configurações específicas do projeto (geradas automaticamente)"
      - ".vscode: Configurações VS Code e MCP (geradas automaticamente)"
      - "{{FOLDER_STRUCTURE_CUSTOM}}"
      - "docs: Documentação geral do projeto"
      - "docs/architecture: Documentos de arquitetura e design"
      - "docs/architecture/adr: Architecture Decision Records"
      - "docs/bugs: Repositório de bug reports (obrigatório para cada erro encontrado)"
      - "docs/debates: Documentação de debates técnicos"
      - "docs/guides: Guias de como fazer tarefas comuns e boas práticas"
      - "docs/reference: Documentação de referência (fluxos de sessão, integrações)"
      - "docs/SESSIONS: Logs de atividades por sessão (subdiretórios YYYY-MM-DD/)"
      - "scripts: Scripts de automação"
      - "src: Código-fonte do projeto (estrutura específica por tipo)"
      - "tests: Testes automatizados (pytest)"
      - "tmp: Arquivos temporários e logs (não versionados)"
      - "pyproject.toml: Metadados do projeto Python, dependências, configurações (black, ruff, mypy)"
      - "Makefile: Targets convenientes (make setup, make test, make dev, make format)"
      - ".gitignore: Excluir .secrets/, tmp/, *.pyc, .venv/, __pycache__/"

    expected_outcome:
      primary_deliverables:
        - "{{DELIVERABLE_1}}"
        - "{{DELIVERABLE_2}}"
        - "{{DELIVERABLE_3}}"
      success_criteria:
        - "{{SUCCESS_CRITERION_1}}"
        - "{{SUCCESS_CRITERION_2}}"
        - "{{SUCCESS_CRITERION_3}}"
        - "Todos os testes passando (pytest --cov mostra 80%+ de cobertura)"
        - "Verificação de segurança limpa (sem credenciais no repo, relatório bandit/safety verde)"
        - "Documentação completa (README, ADRs, guias)"
        - "Reproduzível do zero: clone limpo → executar script de setup → ambiente completo funcionando"
      quality_gates:
        - "Código: 100% type hints (mypy strict), 0 violações ruff, formatado com black"
        - "Testes: 80%+ cobertura (branches), todos os testes em menos de 5s, sem testes instáveis"
        - "Segurança: sem segredos hardcoded, todas as entradas validadas, tratamento de erros adequado"
        - "Documentação: toda função tem docstring com exemplos, toda decisão de design registrada"

    infrastructure:
      resource_scope: "{{RESOURCE_SCOPE}}"
      operating_system: "{{OPERATING_SYSTEM}}"
      hardware_spec:
        cpu: "{{CPU_SPEC}}"
        ram: "{{RAM_SPEC}}"
        storage: "{{STORAGE_SPEC}}"
        gpu: "{{GPU_SPEC}}"
      software_requirements:
        python: "{{PYTHON_VERSION}}"
        git: "2.30+"
        editor: "{{EDITOR}}"
      key_dependencies:
        - "{{DEPENDENCY_1}}"
        - "{{DEPENDENCY_2}}"
        - "{{DEPENDENCY_3}}"
      environment_variables: "Gerenciadas em .secrets/*.json (nunca commitadas)"

    ai_safety_instructions:
      description: "REGRAS CRÍTICAS — Devem ser rigorosamente seguidas por assistentes de IA sem exceção"
      security_and_privacy:
        - "🚨 NUNCA expor, mencionar ou ecoar dados sensíveis no chat: senhas, chaves de API, tokens, credenciais, nomes de usuário, endereços de email, endereços IP, URLs privadas, chaves SSH, credenciais de banco, ou qualquer informação de identificação pessoal (PII)"
        - "🚨 NUNCA exibir caminhos completos para arquivos contendo segredos, mesmo ao mencionar a estrutura de diretórios"
        - "🚨 SEMPRE mascarar ou redigir dados sensíveis em logs, mensagens de erro e saídas de debugging antes de exibir"
        - "🚨 NUNCA armazenar histórico de sessão, logs de chat ou artefatos de trabalho em controle de versão se contiverem QUALQUER informação sensível"
        - "🚨 Se um usuário colar dados sensíveis acidentalmente, sinalizar imediatamente e solicitar o uso de valores placeholder"
      code_and_artifact_handling:
        - "✅ APENAS criar arquivos explicitamente solicitados pelo usuário ou essenciais para completar a tarefa"
        - "✅ NUNCA gerar arquivos além do que está especificado na solicitação do usuário"
        - "✅ NUNCA modificar arquivos de governança (.copilot-instructions.md, .copilot-rules.md) sem consentimento explícito do usuário"
        - "✅ SEMPRE preservar comentários, docstrings e estilo de documentação existentes ao editar arquivos"
        - "✅ Ao editar arquivos YAML/JSON, manter indentação e estrutura corretas; validar sintaxe antes de commitar"
        - "✅ NUNCA usar comandos de terminal (cat, echo, heredoc, mv, cp, rm) para operações de arquivo; usar ferramentas designadas"
      communication_standards:
        - "📝 NUNCA assumir intenção do usuário; fazer perguntas de clarificação se a solicitação for ambígua"
        - "📝 SEMPRE explicar quais alterações estão sendo feitas e POR QUÊ antes de executá-las"
        - "📝 Manter respostas concisas e diretas; evitar preâmbulos desnecessários"
        - "📝 Ao descrever localizações de arquivo, SEMPRE usar links markdown adequados"
        - "📝 SEMPRE seguir diretrizes de estilo de documentação em docs/guides/SESSION_DOCS_STYLE_GUIDE.md"
      task_execution:
        - "🎯 SEMPRE completar a solicitação completa do usuário antes de encerrar o turno"
        - "🎯 Usar chamadas de ferramentas paralelas (quando seguro) para reunir contexto mais rapidamente"
        - "🎯 NUNCA pular etapas de validação ou testes; executar testes/linters antes de declarar trabalho completo"
        - "🎯 Se bloqueado por contexto ausente, pesquisar/ler arquivos proativamente em vez de perguntar ao usuário"
        - "🎯 Ao encontrar erros, criar bug-reports em docs/bugs/ seguindo processo em docs/guides/ISSUE_MANAGEMENT_GUIDE.md"
      documentation_and_accuracy:
        - "📖 SEMPRE documentar premissas, trade-offs e decisões tomadas durante a implementação"
        - "📖 NUNCA inventar ou alucinar caminhos de arquivo, comandos ou assinaturas de API; verificar no workspace/documentação"
        - "📖 SEMPRE validar sintaxe YAML/JSON usando ferramentas de linting apropriadas antes de marcar como completo"
        - "📖 SEMPRE citar ou vincular a arquivos/linhas de origem relevantes ao explicar comportamento de código"

    profile:
      role: "{{PROFILE_ROLE}}"
      experience_level: "{{EXPERIENCE_LEVEL}}"
      expertise_by_domain:
        - domain: "{{DOMAIN_1}}"
          level: "{{LEVEL_1}}"
          focus: "{{FOCUS_1}}"
        - domain: "{{DOMAIN_2}}"
          level: "{{LEVEL_2}}"
          focus: "{{FOCUS_2}}"
        - domain: "{{DOMAIN_3}}"
          level: "{{LEVEL_3}}"
          focus: "{{FOCUS_3}}"
      core_objectives:
        - "{{CORE_OBJECTIVE_1}}"
        - "{{CORE_OBJECTIVE_2}}"
        - "{{CORE_OBJECTIVE_3}}"
      constraints:
        - "{{CONSTRAINT_1}}"
        - "{{CONSTRAINT_2}}"
        - "Sem segredos externos no código; todas as credenciais em .secrets/ (não versionado)"
      tool_preferences:
        - "Python 3.10+ para todos os scripts e automação"
        - "Make/shell para orquestração simples; Python para lógica complexa"
        - "Pytest para testes; nunca usar curl manual (sempre usar Python requests)"
        - "Hooks pre-commit para aplicar qualidade antes dos commits"
        - "{{TOOL_PREFERENCE_CUSTOM}}"
      work_style:
        - "Desenvolvimento orientado por especificação (SDD): spec → plan → tasks → implement"
        - "Commits atômicos e bem documentados com mensagens de commit claras"
        - "Rastreamento de trabalho baseado em sessões (tempo, decisões, resultados em docs/SESSIONS/)"
        - "Validação contínua: testes, linting e verificações de segurança em cada etapa"

    features_to_implement:
      - "{{FEATURE_1}}"
      - "{{FEATURE_2}}"
      - "{{FEATURE_3}}"

    pending_tasks:
      phase_1_prerequisites:
        - "[ ] {{PREREQUISITE_1}}"
        - "[ ] {{PREREQUISITE_2}}"
      phase_2_core_implementation:
        - "[ ] {{CORE_TASK_1}}"
        - "[ ] {{CORE_TASK_2}}"
        - "[ ] {{CORE_TASK_3}}"
      phase_3_quality_validation:
        - "[ ] Executar suite completa pytest (requisito 80%+ cobertura)"
        - "[ ] Verificação de segurança: bandit, safety, sem credenciais no repo"
        - "[ ] Revisão final de documentação e verificação de completude"
