schema_version: "1.0.0"

name: data-warehouse-dbt
layer: 3
version: "1.0.0"
last_tested: "2026-06-21"
status: stable

description: >
  Perfil Layer 3 para data warehousing com dbt Core.
  Estrutura multi-camada (staging → intermediate → marts),
  testes de dados (schema + singular), macro generate_schema_name,
  packages dbt_utils + dbt_expectations. Compatível com qualquer
  banco SQL (Postgres, BigQuery, Snowflake, Redshift).

meta:
  maintained_by: "@yves_marinho"
  language: sql
  framework: dbt-core
  tags:
    - dbt
    - data-warehouse
    - analytics
    - sql
    - data-engineering
    - layer3

stack:
  tool: "dbt-core >= 1.7"
  adapters:
    - dbt-postgres
    - dbt-bigquery
    - dbt-snowflake
    - dbt-redshift
  packages:
    - dbt-labs/dbt_utils >= 1.1
    - calogica/dbt_expectations >= 0.10

combines_with:
  - python-fastapi
  - python-flask

templates_path: ".github/templates/data-warehouse-dbt"

templates:
  - path: "dbt/dbt_project.yml"
    description: "Configuração dbt — materializations por camada (view → staging/intermediate, table → marts)"

  - path: "dbt/profiles.yml.example"
    description: "Profiles multi-ambiente com env_var() para credentials — nunca commitado"

  - path: "dbt/packages.yml"
    description: "Dependências: dbt_utils + dbt_expectations"

  - path: "dbt/models/staging/stg_example.sql"
    description: "Staging model: renomeia colunas, filtra soft-deletes, sem business logic"

  - path: "dbt/models/staging/stg_example.yml"
    description: "Sources + tests de schema para staging (unique, not_null, accepted_values)"

  - path: "dbt/models/marts/mart_example.sql"
    description: "Mart model: agregação diária por status, pronto para BI"

  - path: "dbt/models/marts/mart_example.yml"
    description: "Documentação + tests do mart (expression_is_true para amounts)"

  - path: "dbt/macros/generate_schema_name.sql"
    description: "Macro de schema consistente entre ambientes (remove prefixo de usuário)"

  - path: "dbt/tests/assert_no_negative_amounts.sql"
    description: "Singular data test: verifica ausência de amounts negativos"

  - path: "Makefile.dbt"
    description: "Targets: dbt-deps, dbt-run, dbt-test, dbt-seed, dbt-docs, dbt-docs-serve, dbt-freshness, dbt-debug"
