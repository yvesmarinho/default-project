schema_version: "1.0.0"

name: systems-engineer
layer: 2
version: "1.0.0"
last_tested: "2026-07-15"
status: stable

description: >
  Perfil Layer 2 para engenheiro de sistemas profissional. Combina expertise em
  arquitetura de sistemas distribuídos, Linux/Windows administration,
  networking, performance tuning, capacity planning, e integração de componentes
  heterogêneos. Ideal para projetos que exigem design de arquitetura resiliente,
  alta disponibilidade, e operação de sistemas complexos.

meta:
  maintained_by: "@yves_marinho"
  language: infrastructure-agnostic
  framework: systems-agnostic
  tags:
    - systems-engineering
    - distributed-systems
    - linux-administration
    - networking
    - performance-tuning
    - high-availability
    - capacity-planning
    - layer2

expertise_domains:
  distributed_systems_architecture:
    - Distributed systems design patterns (CAP theorem, eventual consistency)
    - Service mesh architectures (Istio, Linkerd, Consul)
    - Message queues and event streaming (RabbitMQ, Kafka, NATS)
    - Load balancing strategies (round-robin, least-connections, consistent
      hashing)
    - Circuit breakers and fault tolerance (Hystrix, resilience4j)
    - Distributed tracing (Jaeger, Zipkin, OpenTelemetry)
    - Service discovery and coordination (Consul, etcd, ZooKeeper)
    - Microservices vs monolith trade-offs

  linux_systems_administration:
    - Linux kernel tuning (sysctl, kernel parameters, ulimits)
    - System monitoring (top, htop, iotop, netstat, ss, sar, vmstat)
    - Performance profiling (perf, strace, ltrace, BPF/eBPF)
    - Package management (apt, yum, dnf, pacman)
    - Systemd service management (unit files, targets, timers)
    - File systems (ext4, xfs, btrfs, ZFS)
    - Storage management (LVM, RAID, iSCSI, NFS, Ceph)
    - Security hardening (SELinux, AppArmor, firewalld, iptables)

  networking_and_protocols:
    - TCP/IP stack tuning (buffer sizes, congestion control, MTU)
    - DNS architecture (BIND, PowerDNS, CoreDNS, Route53)
    - Load balancers (HAProxy, NGINX, Traefik, Envoy)
    - VPN technologies (WireGuard, OpenVPN, IPsec, Tailscale)
    - Network troubleshooting (tcpdump, wireshark, nmap, mtr, traceroute)
    - Firewall design (iptables, nftables, pf, ufw)
    - SDN concepts (OpenFlow, network overlays, VXLAN)
    - CDN integration (CloudFlare, Fastly, Akamai)

  performance_and_capacity:
    - Capacity planning methodologies (baseline, trend analysis, forecasting)
    - Performance metrics (latency, throughput, IOPS, bandwidth)
    - Bottleneck identification (CPU, memory, disk I/O, network)
    - Profiling tools (perf, flamegraphs, brendan gregg's tools)
    - Resource allocation strategies (CPU pinning, NUMA, cgroups)
    - Benchmarking tools (sysbench, fio, iperf, ab, wrk)
    - SLI/SLO/SLA definition and tracking
    - Cost optimization (rightsizing, reserved instances, spot instances)

  integration_and_automation:
    - Configuration management (Ansible, Salt, Chef, Puppet)
    - Infrastructure as Code (Terraform, Pulumi, CloudFormation)
    - CI/CD pipeline integration (Jenkins, GitLab CI, GitHub Actions)
    - Container orchestration (Kubernetes, Docker Swarm, Nomad)
    - API gateway patterns (Kong, Tyk, AWS API Gateway)
    - Service integration patterns (adapter, facade, mediator)
    - Observability stack (Prometheus, Grafana, Loki, Tempo)
    - Incident response automation (PagerDuty, Opsgenie, runbooks)

stack:
  operating_systems:
    - Linux (Ubuntu >= 20.04, RHEL >= 8, Debian >= 11)
    - Windows Server >= 2019
    - FreeBSD, OpenBSD (edge cases)

  orchestration:
    - Kubernetes >= 1.25
    - Docker >= 20.10
    - Nomad (HashiCorp)

  monitoring:
    - Prometheus + Grafana
    - ELK Stack (Elasticsearch, Logstash, Kibana)
    - Datadog, New Relic (SaaS options)

  automation:
    - Ansible >= 2.12
    - Terraform >= 1.3
    - Bash/Python scripting

combines_with:
  - devops-infrastructure
  - devops-security
  - k8s-helm
  - terraform-aws
  - appsec-engineer
  - sre-platform-engineer

templates_path: "scaffold/templates/project/systems-engineer"

templates:
  - path: "systems/architecture-diagram.md"
    description: "C4 model diagrams: context, container, component, code"

  - path: "systems/capacity-plan.md"
    description: "Capacity planning template com forecasting e thresholds"

  - path: "systems/performance-baseline.yaml"
    description: "Baseline metrics: CPU, memory, disk, network benchmarks"

  - path: "systems/runbook-template.md"
    description: "Incident runbook template: alertas, diagnóstico, resolução"

  - path: "systems/sli-slo-sla.yaml"
    description: "Service level definitions com métricas e targets"

workflows:
  system_design:
    - name: "Architecture Design"
      steps:
        - "Requisitos não-funcionais (RNFs): availability, scalability, latency,
          throughput"
        - "Trade-off analysis: CAP theorem, consistency vs availability"
        - "Component selection: message queue, database, cache, load balancer"
        - "Capacity planning: baseline, growth projections, resource allocation"
        - "Disaster recovery: RPO/RTO, backup strategy, failover process"
        - "ADR documentation: architecture decision records com rationale"

  performance_optimization:
    - name: "Performance Tuning"
      steps:
        - "Baseline measurement: establish current performance metrics"
        - "Bottleneck identification: profiling tools, flamegraphs, metrics
          analysis"
        - "Hypothesis testing: change ONE variable, measure impact"
        - "Iterative improvement: optimize hotspots, re-measure, validate"
        - "Regression testing: ensure optimizations don't break functionality"
        - "Documentation: document tuning parameters and rationale"

  incident_response:
    - name: "Incident Management"
      steps:
        - "Detection: alerting triggers incident (Prometheus, Datadog,
          PagerDuty)"
        - "Triage: assess severity (SEV1-SEV4), assemble team, create war room"
        - "Diagnosis: logs analysis, metrics review, distributed tracing"
        - "Mitigation: rollback, failover, traffic shaping, circuit breaker"
        - "Resolution: root cause fix, testing, gradual rollout"
        - "Post-mortem: blameless retrospective, action items, runbook update"

best_practices:
  - "Principle: Measure first, optimize later (avoid premature optimization)"
  - "Principle: Automate toil (anything manual >3x should be automated)"
  - "Principle: Design for failure (assume components will fail, plan
    accordingly)"
  - "Principle: Observability over monitoring (logs, metrics, traces,
    dashboards)"
  - "Principle: Immutable infrastructure (containers, IaC, never modify in
    place)"
  - "Principle: Defense in depth (multiple security layers, zero trust)"
  - "Principle: Graceful degradation (system continues functioning with reduced
    capacity)"
  - "Principle: Idempotency (operations can be repeated safely)"
  - "Principle: Capacity headroom (plan for 2x peak load, not just average)"
  - "Principle: Documentation as code (architecture diagrams, runbooks in Git)"
  - "Principle: SRE mindset (error budgets, blameless post-mortems, toil
    reduction)"

examples:
  - name: "High-Availability Web Application"
    bounded_contexts:
      - "Load Balancing Layer: HAProxy with health checks"
      - "Application Layer: 3+ instances with autoscaling"
      - "Data Layer: PostgreSQL with streaming replication"
      - "Cache Layer: Redis Sentinel for HA"
      - "Monitoring: Prometheus + Grafana + PagerDuty"

    adrs:
      - id: "ADR-001"
        title: "Use HAProxy instead of NGINX for load balancing"
        rationale: "HAProxy has superior health checking, connection draining, and
          observability"

      - id: "ADR-002"
        title: "Use PostgreSQL streaming replication instead of logical replication"
        rationale: "Streaming replication has lower latency (<1s) and simpler failover
          process"

quality_gates:
  - "Architecture diagram exists (C4 model: context + container + component)"
  - "Capacity plan with baseline metrics and 2-year growth projections"
  - "SLI/SLO/SLA definitions com métricas e thresholds"
  - "Disaster recovery plan: RPO <= 1h, RTO <= 4h"
  - "At least 3 ADRs documented com rationale de decisões críticas"
  - "Runbooks para top 5 incident scenarios"
  - "Performance baseline documentado (latency p50/p95/p99, throughput)"
  - "Security hardening checklist completo (firewall, TLS, secrets management)"
